<style>
:root{--ink:#1E2347;--mut:#6B7094;--pur:#6C5CE7;--pur2:#9A90F8;--line:#E6E4F5;--ok:#1FA463;--warn:#E8890C;--bad:#DC4B4B;--yel:#F7B500;--card:rgba(255,255,255,.78);--sh:0 6px 20px rgba(112,100,200,.13)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;
 background:radial-gradient(70% 45% at 105% 22%,#E3DDFB 0,transparent 70%),radial-gradient(60% 30% at -5% 46%,#FCEEE4 0,transparent 70%),#F3F2FB;background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em}
.page{display:none;height:100dvh;overflow-y:auto}
.page.on{display:block}
.col{max-width:460px;margin:0 auto;padding:10px 16px 18px}
/* ---------- inicio ---------- */
.top{display:flex;align-items:center;gap:6px;height:52px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;position:relative;flex:none}
.ib svg{width:25px;height:25px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.av{background:#D9DBEC;border-radius:50%;width:36px;height:36px;margin-left:4px}
.ib.av svg{fill:var(--ink);stroke:none;width:22px;height:22px}
.ib .dot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:#FF8A1F;border:2px solid #F3F2FB}
.logo{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding-left:6px;line-height:1;min-width:0}
.logo svg{width:74px;height:15px;margin:0 0 -3px 2px;display:block}
.logo b{font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.logo b i{font-style:normal;background:linear-gradient(90deg,#4B3FE0,#7A5CF5);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-size:9.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:3px;margin-top:2px;white-space:nowrap}
.logo small::before{content:"";width:12px;height:2.5px;background:var(--yel);border-radius:2px}
.wv{display:inline-flex;align-items:center;gap:3px;height:26px}
.wv i{display:block;width:3.5px;border-radius:3px;background:var(--pur2);height:30%}
.wv i:nth-child(2),.wv i:nth-child(6){height:45%}.wv i:nth-child(3),.wv i:nth-child(5){height:75%}.wv i:nth-child(4){height:100%}
.wv.s5 i:nth-child(1),.wv.s5 i:nth-child(5){height:35%}.wv.s5 i:nth-child(2),.wv.s5 i:nth-child(4){height:65%}.wv.s5 i:nth-child(3){height:100%}
.hero{text-align:center;padding-top:2px}
.hero h1{font-size:21px;font-weight:600;line-height:1.22;letter-spacing:-.01em;margin:2px auto 10px;max-width:330px;min-height:52px;display:flex;align-items:center;justify-content:center}
.hero h1.heard{font-size:18px;font-weight:500;color:#4A4F7A}
.talk{display:block;margin:0 auto;position:relative;width:var(--R);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;--R:min(58vw,236px,31dvh)}
.talk::before{content:"";position:absolute;left:50%;top:calc(var(--R)/2);width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(140,130,245,.16) 0 48%,rgba(140,130,245,.07) 49% 62%,transparent 70%);pointer-events:none}
.ring{display:block;position:relative;width:var(--R);aspect-ratio:1;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#CBD2F0;
 box-shadow:0 0 14px 3px rgba(255,255,255,.95),0 0 44px 8px rgba(140,130,250,.35);transition:box-shadow .25s}
.ring img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.micrw{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:calc(var(--R)*-.2);position:relative;width:170%;margin-left:-35%}
.micb{width:calc(var(--R)*.4);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,#A39AF9,#6B5BE6);border:4px solid rgba(255,255,255,.9);box-shadow:0 10px 24px rgba(108,92,231,.45);transition:transform .12s}
.micb svg{width:44%;height:44%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.micrw .wv{height:34px;opacity:.75}
.micrw .wv i{width:4px}
.talk:active .micb{transform:scale(.94)}
.talk[data-s=listening] .ring{box-shadow:0 0 16px 4px #fff,0 0 0 8px rgba(108,92,231,.25),0 0 60px 18px rgba(108,92,231,.55)}
.talk[data-s=listening] .micb{background:linear-gradient(160deg,#FF8E8E,#E0457B);box-shadow:0 10px 26px rgba(224,69,123,.5)}
.talk[data-s=speaking] .ring{box-shadow:0 0 16px 4px #fff,0 0 54px 14px rgba(60,180,255,.55)}
.talk[data-s=thinking] .ring{animation:think 1s ease-in-out infinite alternate}
@keyframes think{to{box-shadow:0 0 14px 3px #fff,0 0 60px 16px rgba(247,181,0,.55)}}
.talk[data-s=listening] .wv i,.talk[data-s=speaking] .wv i,.hero[data-s=listening] .wv i,.hero[data-s=speaking] .wv i{animation:bar .7s ease-in-out infinite alternate}
.wv i:nth-child(2n){animation-delay:.15s!important}.wv i:nth-child(3n){animation-delay:.3s!important}

#status{font-size:14px;font-weight:500;margin:8px 0 12px;min-height:19px}

.dots{flex:none;width:36px;height:36px;border-radius:10px;color:var(--pur);font-weight:800;letter-spacing:1px;font-size:15px}

.qty input{width:58px;height:30px;text-align:center;border:1.5px solid var(--line);border-radius:9px;font-size:16px;font-weight:600;background:#fff;-moz-appearance:textfield}

.qty.big button{width:36px;height:36px;font-size:18px}.qty.big input{width:72px;height:36px}
.csel{display:flex;align-items:center;gap:10px;background:#F0EEFC;border-radius:14px;padding:10px 12px}

#cieBox{grid-column:1/-1}

.cres{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}

.opts{display:grid;gap:6px;margin-top:10px}
.opts button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:500}
.cfm{display:flex;gap:8px;margin-top:11px}
.cfm .btn{flex:1}
.rlink{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}

#listLine{display:flex;width:100%;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-weight:600;font-size:14.5px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.grid button{padding:11px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;letter-spacing:-.01em;font-weight:600;border-radius:18px;min-width:0}
.grid img{height:36px;width:auto;display:block}
.grid span{white-space:nowrap}
.today{display:flex;width:100%;align-items:center;gap:13px;padding:12px 16px;margin-top:12px;text-align:left}
.today .t{flex:1;min-width:0}
.today small{display:block;font-size:13px;font-weight:500}

.mb i{display:block;width:9px;border-radius:3px;background:#B3ABF6;min-height:4px}

.mb.sm{height:24px}.mb.sm i{width:7px;background:var(--pur)}

.vtop{display:flex;align-items:center;gap:8px;height:52px;margin-bottom:6px}

.back{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;flex:none}

.btn{background:linear-gradient(160deg,#8E84F5,#6B5BE6);color:#fff;border-radius:14px;padding:10px 15px;font-weight:600;font-size:14.5px;box-shadow:0 4px 12px rgba(108,92,231,.3)}

.search{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;outline:none;margin-bottom:9px}

.list{overflow:hidden}
.rowi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:center}
.rowi:last-child{border-bottom:0}
.rowi .nm{font-weight:600}
.rowi .sb{color:var(--mut);font-size:12.5px;grid-column:1}
.rowi .r{grid-column:2;grid-row:1/span 2;text-align:right}
.rowi .r b{font-size:15.5px;display:block;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;background:#E3F5EB;color:#167A49;white-space:nowrap}

.bar{height:6px;background:#ECEBF7;border-radius:4px;overflow:hidden;margin-top:6px;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.sect{font-size:16px;font-weight:700;margin:18px 2px 8px}

.tbl{width:100%;border-collapse:collapse}

.sw{width:50px;height:30px;border-radius:16px;background:#CFCDE2;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--pur)}.sw[aria-checked=true]::after{left:23px}

.sacts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

function dayTotals(n,vend){const out=[];for(let d=n-1;d>=0;d--){const x=new Date();x.setDate(x.getDate()-d);const k=dayKey(x);out.push({l:d===0?'Hoy':x.toLocaleDateString('es-CO',{weekday:'short'}).replace('.',''),v:S.ventas.filter(v=>dayKey(v.fecha)===k&&(!vend||v.vend===vend)).reduce((a,v)=>a+v.total,0)})}return out}

let sample=null,dict=null,tts=null,capsReady=false;
let listening=false,starting=false,speaking=false,busy=false,conv=false,pressed=false,wasActive=false,pendingStop=false,downAt=0,dBuf='',dTimer=null,spk=0,tip='';
function upd(){const s=listening?'listening':busy?'thinking':speaking?'speaking':'idle';
  $('#talk').dataset.s=s; $('#hero').dataset.s=s;
  $('#status').textContent=tip||({listening:conv&&!pressed?'Escuchando… toca para terminar':'Escuchando… suelta para responder',thinking:'Pensando…',speaking:conv?'Respondiendo… toca para detener':'Respondiendo…',
    idle:capsReady&&!dict?'Toca el robot para escribir tu pregunta':'Mantén presionado para hablar'})[s]}
function setTip(t){tip=t;upd();clearTimeout(setTip.t);if(t)setTip.t=setTimeout(()=>{tip='';upd()},4500)}
async function initCaps(){
  if(window.claude&&window.claude.use){
    try{dict=await window.claude.use('dictation')}catch(e){}
    try{tts=await window.claude.use('tts')}catch(e){}
    try{sample=await window.claude.use('sample')}catch(e){}
  }
  if(!dict){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR)dict=makeSR(SR)}
  capsReady=true;
  if(dict){
    dict.onPartial(({text})=>{heard((dBuf+' '+text).trim()||'…',true)});
    dict.onFinal(({text})=>{dBuf=(dBuf+' '+text).trim();heard(dBuf,true);if(conv&&!pressed){clearTimeout(dTimer);dTimer=setTimeout(()=>{dict.stop().catch(()=>{})},900)}});
    dict.onState(({state})=>{const was=listening;listening=state==='listening';
      if(listening&&pendingStop){pendingStop=false;dict.stop().catch(()=>{})}
      if(!listening&&was){clearTimeout(dTimer);const t=dBuf.trim();dBuf='';if(t)submit(t);else{conv=false;const h=$('#headline');if(h.textContent==='…')h.textContent='Hola, ¿en qué puedo ayudarte con tu ferretería hoy?'}}
      upd()});
  }
  upd();
}
function makeSR(SR){const cb={};let rec=null,active=false,stopRes=null,pend='';
  return{start(){return new Promise((res,rej)=>{try{rec=new SR();rec.lang='es-CO';rec.interimResults=true;rec.continuous=true;pend='';
      rec.onstart=()=>{active=true;cb.state&&cb.state({state:'listening'});res()};
      rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){pend='';cb.final&&cb.final({text:r[0].transcript.trim()})}else it+=r[0].transcript}
        if(it){pend=it.trim();cb.partial&&cb.partial({text:pend})}};
      rec.onerror=e=>{if(!active)rej({code:(e.error==='not-allowed'||e.error==='service-not-allowed')?'not_granted':e.error})};
      rec.onend=()=>{const w=active;active=false;if(w){if(pend){const t=pend;pend='';cb.final&&cb.final({text:t})}cb.state&&cb.state({state:'idle'})}if(stopRes){stopRes();stopRes=null}};
      rec.start()}catch(e){rej({code:'error'})}})},
    stop(){return new Promise(res=>{if(!rec||!active)return res();stopRes=res;try{rec.stop()}catch(e){res()}})},
    onPartial(f){cb.partial=f},onFinal(f){cb.final=f},onState(f){cb.state=f}}}
let ttsUnlocked=false;
function unlockTTS(){if(ttsUnlocked||tts||!window.speechSynthesis)return;ttsUnlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function esVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));const pr=['es-CO','es-MX','es-US','es-419','es-ES'];for(const p of pr){const v=vs.find(x=>x.lang.replace('_','-')===p);if(v)return v}return vs[0]||null}catch(e){return null}}
function startListen(auto){if(!dict||listening||starting)return;starting=true;dBuf='';pendingStop=false;
  dict.start().then(()=>{starting=false},e=>{starting=false;pendingStop=false;
    if(e&&e.code==='not_granted'){conv=false;setTip('Sin permiso de micrófono. Toca ••• para escribir.')}
    else if(auto){conv=false;setTip('Toca el robot para seguir hablando')}
    else if(!pressed&&conv){/* el toque corto puede reintentar al soltar */}
    upd()})}
function stopAll(){conv=false;clearTimeout(dTimer);stopSpeak();if(listening)dict.stop().catch(()=>{});upd()}
const talk=$('#talk');
talk.addEventListener('pointerdown',e=>{if(e.button)return; if(!dict){return}
  pressed=true;downAt=Date.now();wasActive=conv||listening||speaking;
  try{talk.setPointerCapture(e.pointerId)}catch(_){}
  if(!wasActive){stopSpeak();unlockTTS();startListen(false)} upd()});
function release(cancel){if(!pressed)return;pressed=false;const dur=Date.now()-downAt;
  if(wasActive){stopAll();return}
  if(dur>=450||cancel){conv=false;clearTimeout(dTimer);if(listening)dict.stop().catch(()=>{});else if(starting)pendingStop=true}
  else{conv=true;if(!listening&&!starting)startListen(false)}
  upd()}
talk.addEventListener('pointerup',()=>release(false));
talk.addEventListener('pointercancel',()=>release(true));
talk.addEventListener('contextmenu',e=>e.preventDefault());
talk.addEventListener('click',e=>{
  if(!dict){unlockTTS();openType();if(capsReady)setTip('Aquí no se puede abrir el micrófono: escribe o usa el micrófono del teclado.');return}
  if(e.detail===0){if(conv||listening||speaking)stopAll();else{conv=true;startListen(false);upd()}}});
function stopSpeak(){spk++;speaking=false;try{if(tts){const r=tts.stop();if(r&&r.catch)r.catch(()=>{})}}catch(e){} try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
function speak(text){if(!cfg.voz)return Promise.resolve();
  const s=hablado(text).replace(/FV-/g,'F V ').replace(/CT-/g,'C T ').replace(/"/g,' pulgadas ').replace(/#/g,'número ');
  const my=++spk; speaking=true; upd(); let p;
  if(tts)p=tts.speak(s,{language:'es',voice:cfg.voice}).catch(()=>{});
  else p=new Promise(res=>{try{if(!window.speechSynthesis)return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);const vv=esVoice();if(vv){u.voice=vv;u.lang=vv.lang}else u.lang='es-MX';u.rate=1.05;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,Math.min(25000,1500+s.length*90))}catch(e){res()}});
  return p.then(()=>{if(my===spk){speaking=false;upd()}return my===spk})}
async function askClaude(text){
  const prompt=`Eres el intérprete de órdenes de una ferretería en Colombia. Traduce lo que dijo el vendedor a UNA sola línea, usando exactamente una de estas formas:
precio <nombre exacto de producto del catálogo>
agregar <cantidad> <nombre exacto de producto del catálogo>
quitar <nombre exacto de producto>
fiar a <nombre exacto de cliente>
abono de <valor en números> de <nombre exacto de cliente>
cuanto debe <nombre exacto de cliente>
facturar | cotizar | total | cartera | por pagar | ventas de hoy | ventas de la semana | stock bajo | resumen | vaciar lista
RESPUESTA: <respuesta breve en español, máximo dos frases, solo si es una pregunta que se responde con los datos de abajo o si el producto no existe>
No escribas nada más.

Catálogo (nombre | precio | existencias | unidad):
${S.prods.map(p=>`${p.nombre} | ${p.precio} | ${p.stock} | ${p.unidad}`).join('\n')}
Clientes: ${S.clientes.map(c=>c.nombre).join('; ')}
Proveedores: ${S.provs.map(c=>c.nombre).join('; ')}

El vendedor dijo: "${text}"`;
  const r=await sample(prompt,{modelTier:'quick',cache:false}); return (r&&r.text||'').trim().split('\n')[0]}
async function submit(text,label){
  text=String(text).trim(); if(!text||busy)return; stopSpeak();
  if(view!=='inicio')go('inicio');
  heard(label||text); busy=true; upd();
  let r=brain(text);
  if(r.unknown&&sample&&!text.startsWith('#')){
    try{const line=await askClaude(text);
      if(/^RESPUESTA:/i.test(line))r={text:line.replace(/^RESPUESTA:\s*/i,'')};
      else if(line){const r2=brain(line); if(!r2.unknown)r=r2}
    }catch(e){}}
  busy=false; renderReply(r); refreshHome(); upd();
  if(r.form){conv=false;sheetCierre(r.form.k,r.form.cid)}
  const done=await speak(r.text);
  if(conv&&done!==false&&dict&&!listening)startListen(true);
  upd()}

    return head('Reportes',`Tus ventas, ${esc(u.nombre)}.`)+`<div class="kpis">${kpi('Vendiste hoy',fmt(hv.total),nf(hv.n),'good')}${kpi('Últimos 7 días',fmt(wv.total),nf(wv.n))}</div>
    <div class="sect">Tus ventas por día</div><div class="card"><div class="chart">${days.map(d=>`<div><em>${d.v?Math.round(d.v/1000)+'k':''}</em><i style="height:${Math.round(d.v/mx*100)}%"></i><span>${d.l}</span></div>`).join('')}</div></div>
    <div class="sect">Tus facturas de hoy</div><div class="card list">${hv.vs.length?hv.vs.slice().reverse().map(v=>`<button class="rowi" data-act="fact:${v.num}"><span class="nm">${v.num} · ${esc(v.cli?v.cli.nombre:v.cid?cli(v.cid).nombre:'Mostrador')}</span><span class="sb">${ftime(v.fecha)}</span><span class="r"><b>${fmt(v.total)}</b></span></button>`).join(''):'<div class="empty">Aún no has facturado hoy.</div>'}</div>`}
  const h=ventasDe(1), w=ventasDe(7), days=dayTotals(7), mx=Math.max(1,...days.map(d=>d.v)), top={}, low=lowStock();
  w.vs.forEach(v=>v.items.forEach(i=>{top[i.n]=(top[i.n]||0)+i.c*i.p}));
  const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const emp=S.users.map(u=>({u,h:ventasDe(1,u.id),w:ventasDe(7,u.id)})).filter(x=>x.w.n||x.u.rol!=='jefe').sort((a,b)=>b.h.total-a.h.total);
  return head('Reportes')+`<div class="kpis">${kpi('Ventas de hoy',fmt(h.total),nf(h.n),'good')}${kpi('Últimos 7 días',fmt(w.total),nf(w.n))}${kpi('Ticket promedio',fmt(w.n?w.total/w.n:0))}${kpi('Margen bruto',(w.total?Math.round(w.util/w.total*100):0)+' %','7 días')}</div>
  <div class="two"><div><div class="sect">Ventas por empleado</div><div class="card list">${emp.map(x=>`<div class="rowi"><span class="nm">${esc(x.u.nombre)}</span><span class="sb">Hoy ${nf(x.h.n)} · 7 días ${fmt(x.w.total)}</span><span class="r"><b>${fmt(x.h.total)}</b><span class="pill neu">hoy</span></span><span class="bar"><i style="width:${h.total?Math.round(x.h.total/h.total*100):0}%;background:var(--pur)"></i></span></div>`).join('')}</div>
  <div class="sect">Ventas por día</div><div class="card"><div class="chart">${days.map(d=>`<div><em>${d.v?Math.round(d.v/1000)+'k':''}</em><i style="height:${Math.round(d.v/mx*100)}%"></i><span>${d.l}</span></div>`).join('')}</div></div></div>
  <div><div class="sect">Más vendidos · 7 días</div><div class="card"><table class="tbl">${tops.map(t=>`<tr><td>${esc(t[0])}</td><td>${fmt(t[1])}</td></tr>`).join('')}</table></div>
  <div class="sect">Productos por debajo del mínimo</div><div class="card">${low.length?`<table class="tbl">${low.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${p.stock} / mín. ${p.min}</td></tr>`).join('')}</table>`:'<div class="empty">Todo está sobre el mínimo.</div>'}</div></div></div>`}
function vFin(){if(!isJefe())return head('Finanzas')+'<div class="card empty">Las finanzas de la ferretería solo las ve el jefe.</div>';
  const w=ventasDe(7), inv=S.prods.reduce((a,p)=>a+p.stock*p.costo,0), pc=porCobrar(), pp=porPagar();
  return head('Finanzas','Calculado con las ventas, el inventario, los fiados y las deudas.')+
  `<div class="kpis">${kpi('Te deben',fmt(pc),'Clientes','warn')}${kpi('Debes',fmt(pp),'Proveedores','bad')}${kpi('Inventario a costo',fmt(inv))}${kpi('Utilidad bruta 7 días',fmt(w.util),'','good')}</div>
  <div class="two"><div><div class="sect">Resultado · últimos 7 días</div><div class="card"><table class="tbl"><tr><td>Ventas</td><td>${fmt(w.total)}</td></tr><tr><td>Costo de lo vendido</td><td>− ${fmt(w.costo)}</td></tr><tr class="tot"><td>Utilidad bruta</td><td>${fmt(w.util)}</td></tr></table></div></div>
  <div><div class="sect">Posición de la ferretería</div><div class="card"><table class="tbl"><tr><td>Inventario (a costo)</td><td>${fmt(inv)}</td></tr><tr><td>Fiados por cobrar</td><td>+ ${fmt(pc)}</td></tr><tr><td>Deudas con proveedores</td><td>− ${fmt(pp)}</td></tr><tr class="tot"><td>Posición neta</td><td>${fmt(inv+pc-pp)}</td></tr></table></div></div></div>
  <p class="note">No incluye gastos fijos (arriendo, nómina, servicios) ni caja y bancos: son el siguiente módulo.</p>`}
function vCfg(){const vs=[['buttery','Voz 1'],['airy','Voz 2'],['glassy','Voz 3'],['rounded','Voz 4']];
  return head('Configuración')+`<div class="card list">
  <div class="set"><div>Responder con voz<small>El asistente lee la respuesta en voz alta.</small></div><button class="sw" role="switch" aria-checked="${cfg.voz}" data-act="voz" aria-label="Responder con voz"></button></div>

  <div class="set"><div>Usuario<small>${esc(me().nombre)} · ${me().rol==='jefe'?'Jefe':'Vendedor'}</small></div><button class="btn sec sm" data-act="user">Cambiar</button></div>

  <p class="note">Prototipo: los productos, clientes, proveedores y cifras son inventados, y los cambios se guardan solo en este navegador.</p>`}

function openSheet(h){$('#sheet').innerHTML='<button class="x" data-act="close" aria-label="Cerrar">✕</button>'+h;$('#ov').classList.add('on');$('#sheet').scrollTop=0}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function docHTML(tipo,d,cliente,extra){const base=d.total/(1+IVA);
  return`<div class="fact"><div class="hd"><div><b>${tipo} ${d.num}</b><br>Ferretería de muestra</div><div style="text-align:right">${fdate(d.fecha)}<br>${ftime(d.fecha)}</div></div>
  <div>Cliente: <b>${esc(cliente)}</b>${extra||''}</div>${d.cli&&cliTxt(d.cli)?`<div style="color:var(--mut);font-size:13.5px">${cliTxt(d.cli)}</div>`:''}${d.entrega?`<div style="font-size:13.5px;margin-top:3px"><b>${entTxt(d.entrega)}</b></div>`:''}
  <table class="tbl" style="margin-top:6px">${d.items.map(i=>`<tr><td style="padding-left:0">${i.c} × ${esc(i.n)}<br><span style="color:var(--mut);font-size:12.5px">${fmt(i.p)} / ${esc(i.u)}</span></td><td style="padding-right:0">${fmt(i.c*i.p)}</td></tr>`).join('')}
  <tr><td style="padding-left:0">Subtotal sin IVA</td><td style="padding-right:0">${fmt(base)}</td></tr><tr><td style="padding-left:0">IVA 19 %</td><td style="padding-right:0">${fmt(d.total-base)}</td></tr><tr class="tot"><td style="padding-left:0">Total</td><td style="padding-right:0">${fmt(d.total)}</td></tr></table></div>`}
const docText=(tipo,d,cliente)=>`${tipo} ${d.num} · Ferretería de muestra\nCliente: ${cliente}\n`+(d.entrega?(d.entrega.tipo==='domicilio'?`Entrega a domicilio: ${d.entrega.dir}\n`:'Recoge en la tienda\n'):'')+d.items.map(i=>`${i.c} x ${i.n}: ${fmt(i.c*i.p)}`).join('\n')+`\nTOTAL: ${fmt(d.total)} (IVA incluido)`;

function sheetProdEdit(id){const n=id==='new', p=n?{nombre:'',alias:'',unidad:'unidad',cat:'Obra gris',precio:'',costo:'',stock:'',min:'',prov:1}:prod(+id);

function sheetCli(id){if(id==='new'){openSheet(`<h3>Nuevo cliente</h3><form data-form="cli"><div class="fg"><label class="w">Nombre<input name="nombre" required></label><label>Cédula o NIT<input name="doc" required></label><label>Celular<input name="tel" type="tel" required></label><label class="w">Dirección<input name="dir"></label><label>Cupo de crédito<input name="cupo" type="number" inputmode="numeric" min="0" required value="500000"></label><label class="w">Nota<input name="nota"></label></div><div class="sacts"><button class="btn" type="submit">Guardar</button></div></form>`);return}

  ${c.saldo>0?`<form data-form="abono" data-id="${c.id}"><div class="fg" style="margin-top:10px"><label>Valor del abono<input name="v" type="number" inputmode="numeric" min="1" max="${c.saldo}" required></label><label>Medio<select name="ref"><option>Efectivo</option><option>Transferencia</option><option>Nequi</option></select></label></div><div class="sacts"><button class="btn" type="submit">Registrar abono</button></div></form>`:''}
  <div class="sect">Movimientos</div><div class="card"><table class="tbl">${c.mov.length?c.mov.slice().reverse().map(m=>`<tr><td>${m.t==='abono'?'Abono':'Fiado'} · ${esc(m.ref)}<br><span style="color:var(--mut);font-size:12.5px">${fdate(m.f)}</span></td><td style="color:${m.t==='abono'?'var(--ok)':'inherit'}">${m.t==='abono'?'−':'+'} ${fmt(m.v)}</td></tr>`).join(''):'<tr><td>Sin movimientos</td><td></td></tr>'}</table></div>`)}
function sheetCxp(id){const c=S.cxp.find(x=>x.id===+id), s=c.valor-c.pagado;
  openSheet(`<h3>${esc(prv(c.prov).nombre)}</h3><table class="tbl"><tr><td>Factura</td><td>${esc(c.ref)}</td></tr><tr><td>Valor</td><td>${fmt(c.valor)}</td></tr><tr><td>Abonado</td><td>${fmt(c.pagado)}</td></tr><tr><td>Vence</td><td>${fdate(c.vence)}</td></tr><tr class="tot"><td>Saldo</td><td>${fmt(s)}</td></tr></table>

function sheetProv(id){const p=prv(+id), ps=S.prods.filter(x=>x.prov===p.id), low=ps.filter(x=>x.stock<=x.min);
  const ped=low.map(x=>({x,c:Math.max(x.min*2-x.stock,1)})), tp=ped.reduce((a,i)=>a+i.c*i.x.costo,0);
  openSheet(`<h3>${esc(p.nombre)}</h3><div>${esc(p.contacto)} · ${esc(p.tel)}</div>
  <div class="sect">Pedido sugerido</div>${ped.length?`<div class="card"><table class="tbl">${ped.map(i=>`<tr><td>${i.c} ${esc(plural(i.x.unidad,i.c))} · ${esc(i.x.nombre)}<br><span style="color:var(--mut);font-size:12.5px">hay ${i.x.stock}, mínimo ${i.x.min}</span></td><td>${isJefe()?fmt(i.c*i.x.costo):''}</td></tr>`).join('')}${isJefe()?`<tr class="tot"><td>Total estimado</td><td>${fmt(tp)}</td></tr>`:''}</table></div><div class="sacts"><button class="btn sec" data-act="copy:p:${p.id}">Copiar pedido para WhatsApp</button></div>`:'<div class="empty" style="padding:12px">Nada por pedir: todo está sobre el mínimo.</div>'}

function sheetCierre(k,cid){
  if(!S.lista.length){toast('La lista está vacía');return}
  const T={venta:'Facturar',fiar:'Fiar',cot:'Cotizar'}[k], tot=listaTotal(), fin=cid==='final', c=cid&&!fin?cli(+cid):null;
  const v=fin?{nombre:'Consumidor final',tdoc:'CC',doc:'222222222222',tel:'',dir:''}:c?{nombre:c.nombre,tdoc:c.tdoc||'CC',doc:c.doc||'',tel:c.tel||'',dir:c.dir||''}:{nombre:'',tdoc:'CC',doc:'',tel:'',dir:''};
  const req=k==='cot'||fin?'':'required', nuevo=c?c.saldo+tot:tot;
  openSheet(`<h3>${T} · ${fmt(tot)}</h3><form data-form="cierre" data-k="${k}" data-cid="${c?c.id:''}" data-final="${fin?1:''}"><div class="fg">
  <div class="w" id="cieBox" data-k="${k}">${c||fin?`<div class="csel"><div><small>Cliente</small><b>${esc(v.nombre)}</b></div><button class="btn sec sm" type="button" data-act="cierre:${k}:">Cambiar</button></div>`
    :`<label>Buscar cliente<input id="cieQ" type="search" autocomplete="off" placeholder="Nombre, cédula, NIT o celular"></label><div id="cieRes"></div>`}</div>
  <label class="w">Nombre o razón social<input name="nombre" required value="${esc(v.nombre)}"></label>
  <label>Tipo de documento<select name="tdoc">${['CC','NIT','CE','Pasaporte'].map(t=>`<option ${v.tdoc===t?'selected':''}>${t}</option>`).join('')}</select></label>
  <label>Número (cédula o NIT)<input name="doc" inputmode="numeric" ${req} value="${esc(v.doc)}"></label>
  <label>Celular<input name="tel" type="tel" inputmode="tel" ${fin?'':'required'} value="${esc(v.tel)}"></label>
  <label>Dirección<input name="dir" value="${esc(v.dir)}"></label>
  <label class="w">Entrega<select name="entrega" id="cieEnt"><option value="tienda">Recoge en la tienda</option><option value="domicilio">Hay que llevarlo (domicilio)</option></select></label>
  <label class="w" id="cieDirW" hidden>Dirección de entrega<input name="dirEnt" id="cieDir"></label>
  <label class="w" id="cieNotaW" hidden>Indicaciones para la entrega<input name="nota" placeholder="Quién recibe, horario, referencias…"></label></div>
  ${k==='fiar'?`<p class="note" style="${c&&nuevo<=c.cupo?'':'color:var(--bad);font-weight:600'}">${c?`Saldo actual ${fmt(c.saldo)}. Con esta venta queda en ${fmt(nuevo)} de un cupo de ${fmt(c.cupo)}.${nuevo>c.cupo?' Supera el cupo.':''}`:'Cliente nuevo: todavía no tiene cupo de crédito aprobado.'}</p>`:''}
  <div class="sacts"><button class="btn" type="submit">${T} ${fmt(tot)}</button><button class="btn sec" type="button" data-act="close">Cancelar</button></div></form>`);
  if($('#cieQ')){cieSearch();try{$('#cieQ').focus()}catch(e){}}}
function cliFind(q){const n=norm(q), dg=q.replace(/\D/g,'');if(!n&&!dg)return[];
  return S.clientes.filter(x=>{const hay=norm(x.nombre+' '+(x.doc||'')), nums=((x.doc||'')+' '+(x.tel||'')).split(' ').map(s=>s.replace(/\D/g,'')).join(' ')+' '+(x.tel||'').replace(/\D/g,'');
    return (n&&hay.includes(n))||(dg.length>=3&&nums.includes(dg))}).slice(0,6)}
function cieSearch(){const q=$('#cieQ').value.trim(), k=$('#cieBox').dataset.k, r=cliFind(q);
  $('#cieRes').innerHTML=(r.map(x=>`<button type="button" class="cres" data-act="cierre:${k}:${x.id}"><b>${esc(x.nombre)}</b><small>${esc([x.doc?(x.tdoc||'CC')+' '+x.doc:'',x.tel||''].filter(Boolean).join(' · '))}</small></button>`).join(''))
    +(q?`<button type="button" class="cres new" data-act="cienew"><b>+ Cliente nuevo${/\d{5,}/.test(q.replace(/\D/g,''))&&!/[a-zñ]/i.test(q)?'':': «'+esc(q)+'»'}</b><small>${r.length?'No es ninguno de los anteriores':'No hay clientes con ese dato'}</small></button>`:'')
    +(k==='fiar'?'':`<button type="button" class="cres" data-act="cierre:${k}:final"><b>Consumidor final</b><small>Venta de mostrador sin datos</small></button>`)}
const entTxt=e=>!e?'':e.tipo==='domicilio'?`Entrega a domicilio: ${esc(e.dir||'sin dirección')}${e.nota?' · '+esc(e.nota):''}`:'Recoge en la tienda';
const cliTxt=c=>!c?'':[c.doc?`${esc(c.tdoc||'CC')} ${esc(c.doc)}`:'',c.tel?'Cel. '+esc(c.tel):'',c.dir?esc(c.dir):''].filter(Boolean).join(' · ');
function sheetUser(){openSheet(`<h3>¿Quién está usando la app?</h3><div class="card list">${S.users.map(u=>`<button class="rowi" data-act="setuser:${u.id}"><span class="nm">${esc(u.nombre)}</span><span class="sb">${u.rol==='jefe'?'Jefe · ve todo: ventas totales, por empleado, finanzas y deudas':'Vendedor · ve sus propias ventas'}</span><span class="r"><span class="pill ${u.id===S.user?'':'neu'}">${u.id===S.user?'Activo':'Entrar'}</span></span></button>`).join('')}</div><p class="note">En la versión final cada persona entra con su clave.</p>`)}
function sheetMenu(){openSheet(`<h3>Menú</h3><div class="mnu">${MODS.map(([k,l])=>`<button data-act="go:${k}"><img src="${IMG[k]}" alt="">${l}</button>`).join('')}</div>`)}
function sheetAlerts(){const a=alerts();openSheet(`<h3>Alertas</h3>${a.length?`<div class="card list">${a.map(x=>`<button class="rowi" data-act="go:${x.go}"><span class="nm">${esc(x.t)}</span><span class="sb">${esc(x.s)}</span><span class="r"><span class="pill low">Ver</span></span></button>`).join('')}</div>`:'<div class="empty">Sin alertas por ahora.</div>'}`)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}

let jsPDFp=null,logoP=null,pdfCur=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej()};document.head.appendChild(s)})}
function needPDF(){return jsPDFp||(jsPDFp=loadScript('jspdf.umd.min.js').catch(()=>loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js')).then(()=>window.jspdf.jsPDF).catch(e=>{jsPDFp=null;throw e}))}
function getLogo(){return logoP||(logoP=fetch('icon-192.png').then(r=>r.ok?r.blob():Promise.reject()).then(b=>new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>res(null);f.readAsDataURL(b)})).catch(()=>null))}
async function makePDF(tipo,d){
  const J=await needPDF(), logo=await getLogo(), doc=new J({unit:'mm',format:'letter'}), W=215.9, M=15, R=W-M;
  const mon=n=>'$ '+Math.round(n).toLocaleString('es-CO'), fac=tipo==='Factura';
  const ink=()=>doc.setTextColor(30,35,71), mut=()=>doc.setTextColor(105,110,140);
  let y=M;
  if(logo){try{doc.addImage(logo,'PNG',M,y,20,20)}catch(e){}}
  const lx=logo?M+24:M;
  doc.setFont('helvetica','bold');doc.setFontSize(16);ink();doc.text(EMP.nombre,lx,y+7);
  doc.setFont('helvetica','normal');doc.setFontSize(9);mut();doc.text(EMP.nit,lx,y+12.5);doc.text(EMP.dir,lx,y+17);
  doc.setFont('helvetica','bold');doc.setFontSize(13);ink();doc.text(fac?'FACTURA DE VENTA':'COTIZACIÓN',R,y+6,{align:'right'});
  doc.setFontSize(12);doc.setTextColor(108,92,231);doc.text('N.º '+d.num,R,y+12,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(9);mut();
  doc.text(new Date(d.fecha).toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})+' · '+ftime(d.fecha),R,y+17,{align:'right'});
  y+=27;
  const c=d.cli||{}, nom=c.nombre||d.cliente||(d.cid&&cli(d.cid)?cli(d.cid).nombre:'Cliente de mostrador'), ent=d.entrega, v=usr(d.vend);
  const L=[['Cliente',nom],[c.tdoc||'Documento',c.doc||'—'],['Celular',c.tel||'—'],['Dirección',c.dir||'—']];
  const Rr=[fac?['Forma de pago',d.credito?'Crédito':'Contado']:['Estado',d.estado||'Pendiente'],['Atendido por',v?v.nombre:'—'],['Entrega',!ent?'—':ent.tipo==='domicilio'?'A domicilio':'Recoge en la tienda']];
  if(ent&&ent.tipo==='domicilio')Rr.push(['Llevar a',ent.dir||'—']);
  if(ent&&ent.nota)Rr.push(['Indicaciones',ent.nota]);
  const mid=M+98, wL=mid-M-30, wR=R-mid-30; doc.setFontSize(9.5);
  const hOf=(rows,w)=>rows.reduce((a,r)=>a+doc.splitTextToSize(String(r[1]),w).length*4.6,0);
  const bh=Math.max(hOf(L,wL),hOf(Rr,wR))+7;
  doc.setFillColor(244,243,252);doc.roundedRect(M,y,R-M,bh,2.5,2.5,'F');
  const col=(rows,x,w)=>{let yy=y+6.5;rows.forEach(r=>{doc.setFont('helvetica','normal');mut();doc.text(r[0],x,yy);doc.setFont('helvetica','bold');ink();const t=doc.splitTextToSize(String(r[1]),w);doc.text(t,x+26,yy);yy+=t.length*4.6})};
  col(L,M+4,wL);col(Rr,mid,wR);
  y+=bh+6;
  const X={c:M+3,d:M+17,u:M+97,b:150,i:176,t:R-3};
  const th=()=>{doc.setFillColor(30,35,71);doc.rect(M,y,R-M,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(255);
    doc.text('Cant.',X.c,y+5.3);doc.text('Descripción',X.d,y+5.3);doc.text('Unidad',X.u,y+5.3);doc.text('Vr. unit. sin IVA',X.b,y+5.3,{align:'right'});doc.text('IVA 19 %',X.i,y+5.3,{align:'right'});doc.text('Total',X.t,y+5.3,{align:'right'});y+=8};
  th();
  d.items.forEach((it,k)=>{const lines=doc.splitTextToSize(it.n,76), rh=Math.max(7,lines.length*4.4+2.6), tot=it.c*it.p, base=tot/(1+IVA);
    if(y+rh>262){doc.addPage();y=M;th()}
    if(k%2){doc.setFillColor(249,248,254);doc.rect(M,y,R-M,rh,'F')}
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);ink();
    doc.text(String(it.c),X.c,y+4.8);doc.text(lines,X.d,y+4.8);doc.text(it.u,X.u,y+4.8);
    doc.text(mon(it.p/(1+IVA)),X.b,y+4.8,{align:'right'});doc.text(mon(tot-base),X.i,y+4.8,{align:'right'});
    doc.setFont('helvetica','bold');doc.text(mon(tot),X.t,y+4.8,{align:'right'});y+=rh});
  doc.setDrawColor(30,35,71);doc.setLineWidth(.4);doc.line(M,y,R,y);y+=7;
  if(y>240){doc.addPage();y=M+4}
  const base=d.total/(1+IVA), tx=R-62;
  doc.setFont('helvetica','normal');doc.setFontSize(10);mut();doc.text('Subtotal sin IVA',tx,y);ink();doc.text(mon(base),X.t,y,{align:'right'});y+=6;
  mut();doc.text('IVA 19 %',tx,y);ink();doc.text(mon(d.total-base),X.t,y,{align:'right'});y+=4;
  doc.setFillColor(108,92,231);doc.roundedRect(tx-4,y,R-tx+4,10,2,2,'F');doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(255);
  doc.text('TOTAL',tx,y+6.8);doc.text(mon(d.total),X.t,y+6.8,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);mut();
  doc.text(['Los precios de venta incluyen el IVA del 19 %; aquí se discrimina el valor sin IVA y el impuesto.',fac?'Documento de prueba generado por FerreControl. No reemplaza la factura electrónica ante la DIAN.':'Cotización generada por FerreControl. Precios y existencias sujetos a cambio.'],M,y+18);
  const blob=doc.output('blob'), name=`${fac?'Factura':'Cotizacion'}-${d.num}.pdf`;
  return{blob,name,file:new File([blob],name,{type:'application/pdf'}),url:URL.createObjectURL(blob),nom,tel:c.tel||'',tipo,d}}
const PDFBTN='<div class="sacts" id="pdfActs"><button class="btn" data-act="pdf:wa" disabled>Enviar por WhatsApp</button><button class="btn dk" data-act="pdf:print" disabled>Imprimir</button><button class="btn sec" data-act="pdf:down" disabled>Descargar PDF</button></div><p class="note" id="pdfMsg">Preparando el PDF…</p>';
function prepPDF(tipo,d){if(pdfCur){try{URL.revokeObjectURL(pdfCur.url)}catch(e){}}pdfCur=null;
  makePDF(tipo,d).then(p=>{pdfCur=p;const a=$('#pdfActs');if(a){a.querySelectorAll('button').forEach(b=>b.disabled=false);$('#pdfMsg').textContent='PDF listo: '+p.name}},
    ()=>{const m=$('#pdfMsg');if(m)m.textContent='No se pudo preparar el PDF. Revisa la conexión e inténtalo de nuevo.'})}
function pdfDown(){const a=document.createElement('a');a.href=pdfCur.url;a.download=pdfCur.name;document.body.appendChild(a);a.click();a.remove()}
function pdfAct(x){const p=pdfCur;if(!p)return;
  if(x==='down'){try{pdfDown();toast('PDF descargado')}catch(e){toast('Aquí no se puede descargar')}}
  else if(x==='print'){try{
      if(matchMedia('(pointer:coarse)').matches){if(!window.open(p.url,'_blank'))pdfDown()}
      else{let f=$('#pdfFrame');if(f)f.remove();f=document.createElement('iframe');f.id='pdfFrame';f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';f.src=p.url;
        f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(p.url,'_blank')}};document.body.appendChild(f)}
    }catch(e){toast('Aquí no se puede imprimir')}}
  else if(x==='wa'){const txt=`${p.tipo} ${p.d.num} de ${EMP.nombre} por ${fmt(p.d.total)} (IVA incluido).`;
    try{if(navigator.canShare&&navigator.canShare({files:[p.file]})){navigator.share({files:[p.file],title:p.name,text:txt}).catch(()=>{});return}}catch(e){}
    try{pdfDown()}catch(e){}
    const n=p.tel.replace(/\D/g,''), to=n.length===10?'57'+n:n;
    try{window.open('https://wa.me/'+to+'?text='+encodeURIComponent(txt),'_blank')}catch(e){}
    toast('PDF descargado: adjúntalo en el chat')}}

/* ---------- eventos ---------- */
function refresh(){refreshHome();if(view!=='inicio')renderView()}
let resetArm=0;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cmd],[data-act],[data-q],[data-rq],[data-cat]'); if(!b){if(e.target.id==='ov')closeSheet();return}
  if(b.dataset.cat){invCat=b.dataset.cat;renderView();return}
  if(b.dataset.rq){const i=$('#'+b.dataset.for);i.value=Math.max(1,(parseInt(i.value,10)||1)+(+b.dataset.rq));return}
  if(b.dataset.q){const i=S.lista.find(x=>x.pid===+b.dataset.pid);if(i){i.c+=+b.dataset.q;if(i.c<=0)S.lista=S.lista.filter(x=>x!==i);save();renderView()}return}
  if(b.dataset.cmd){submit(b.dataset.cmd,b.dataset.label||b.textContent.trim());return}
  const [a,x,y]=b.dataset.act.split(':');
  if(a==='close')closeSheet();
  else if(a==='go'){closeSheet();go(x)}
  else if(a==='menu')sheetMenu();
  else if(a==='alerts')sheetAlerts();
  else if(a==='store')openSheet('<h3>Ferretería de muestra</h3><p>Este prototipo usa datos inventados: 32 productos, 5 clientes con crédito y 6 proveedores.</p><p class="note">En la versión del cliente aquí van el nombre, el NIT, la dirección y la resolución de facturación.</p>');
  else if(a==='user')sheetUser();
  else if(a==='setuser'){S.user=+x;save();ctx.pending=null;closeSheet();renderReply({text:INTRO});refresh();toast('Sesión: '+me().nombre)}
  else if(a==='type')openType();
  else if(a==='voz'){cfg.voz=!cfg.voz;saveCfg();if(!cfg.voz)stopSpeak();renderView()}
  else if(a==='reset'){if(Date.now()-resetArm>3000){resetArm=Date.now();toast('Toca otra vez para borrar los cambios');return}
    resetArm=0;S=seed();save();ctx.lastPid=null;ctx.pending=null;renderReply({text:INTRO});refresh();toast('Datos de muestra restaurados')}
  else if(a==='pdf')pdfAct(x);
  else if(a==='cienew'){const q=$('#cieQ').value.trim(), f=b.closest('form'), num=!/[a-zñ]/i.test(q)&&q.replace(/\D/g,'').length>=5;
    if(num)f.doc.value=q;else f.nombre.value=q.replace(/(^|\s)\p{L}/gu,m=>m.toUpperCase());$('#cieRes').innerHTML='';(num?f.nombre:f.doc).focus()}
  else if(a==='cierre')sheetCierre(x,y||null);
  else if(a==='fact')sheetFact(x);
  else if(a==='cot')sheetCot(x);
  else if(a==='prod')sheetProd(x);
  else if(a==='cli')sheetCli(x);
  else if(a==='cxp')sheetCxp(x);
  else if(a==='prov')sheetProv(x);
  else if(a==='addq'){const q=Math.max(1,parseInt(($('#'+y)||{}).value,10)||1), p=prod(+x);closeSheet();submit(`#a${x}x${q}`,`Agregar ${q} ${plural(p.unidad,q)} a la lista`)}
  else if(a==='add'){addLista(+x,1);closeSheet();refresh();toast('Agregado a la lista')}
  else if(a==='cot2lista'){const c=S.cots.find(k=>k.num===x);S.lista=c.items.filter(i=>prod(i.pid)).map(i=>({pid:i.pid,c:i.c}));c.estado='Vendida';save();closeSheet();go('ventas');toast('Cotización cargada en la lista')}
  else if(a==='copy'){if(x==='f'){const v=S.ventas.find(k=>k.num===y);copy(docText('Factura',v,v.cli?v.cli.nombre:v.cid?cli(v.cid).nombre:'Mostrador'))}
    else if(x==='c'){const c=S.cots.find(k=>k.num===y);copy(docText('Cotización',c,c.cliente))}
    else{const p=prv(+y);copy(`Pedido para ${p.nombre}\n`+S.prods.filter(k=>k.prov===p.id&&k.stock<=k.min).map(k=>`${Math.max(k.min*2-k.stock,1)} ${plural(k.unidad,2)} · ${k.nombre}`).join('\n'))}}
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(f)), k=f.dataset.form;
  if(k==='cierre'){if(d.entrega==='domicilio'&&!d.dirEnt.trim()){toast('Falta la dirección de entrega');return}
    const r=cerrar(f.dataset.k,{cid:f.dataset.cid?+f.dataset.cid:null,final:!!f.dataset.final,nombre:d.nombre.trim(),tdoc:d.tdoc,doc:d.doc.trim(),tel:d.tel.trim(),dir:d.dir.trim(),entrega:d.entrega,dirEnt:d.dirEnt.trim(),nota:d.nota.trim()});
    closeSheet();if(view!=='inicio')go('inicio');renderReply(r);refresh();speak(r.text);if(r.factura)sheetFact(r.factura);else if(r.cot)sheetCot(r.cot);return}
  if(k==='prod'){const o={nombre:d.nombre.trim(),alias:d.alias.trim(),unidad:d.unidad.trim().toLowerCase(),cat:d.cat.trim(),precio:+d.precio,costo:+d.costo,stock:+d.stock,min:+d.min,prov:+d.prov};
    if(f.dataset.id==='new')S.prods.push(Object.assign({id:S.seq.id++},o));else Object.assign(prod(+f.dataset.id),o);toast('Producto guardado')}
  else if(k==='cli'){S.clientes.push({id:S.seq.id++,nombre:d.nombre.trim(),nota:d.nota.trim(),tel:d.tel.trim(),tdoc:'CC',doc:d.doc.trim(),dir:d.dir.trim(),cupo:+d.cupo,saldo:0,mov:[]});toast('Cliente guardado')}
  else if(k==='abono'){const v=doAbono(+f.dataset.id,+d.v,d.ref);toast('Abono de '+fmt(v)+' registrado')}
  else if(k==='pago'){const v=doPagoProv(+f.dataset.id,+d.v);toast('Pago de '+fmt(v)+' registrado')}
  save();closeSheet();refresh()});
document.addEventListener('input',e=>{if(e.target.id==='cieQ'){cieSearch();return}
  if(e.target.id==='cliQ'){cliQ=e.target.value;$('#cliList').innerHTML=cliRows();return}
  if(e.target.id==='invQ'){invQ=e.target.value;$('#invList').innerHTML=invRows()}});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('lq')){const i=S.lista.find(x=>x.pid===+e.target.dataset.pid), q=parseInt(e.target.value,10);if(i){if(!(q>0))S.lista=S.lista.filter(x=>x!==i);else i.c=q;save();renderView()}return}
  
  if(e.target.id==='cieEnt'){const dm=e.target.value==='domicilio';$('#cieDirW').hidden=!dm;$('#cieNotaW').hidden=!dm;if(dm&&!$('#cieDir').value)$('#cieDir').value=e.target.form.dir.value;return}
  if(e.target.id==='voiceSel'){cfg.voice=e.target.value;saveCfg();speak('Hola, esta es mi voz.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
renderReply({text:INTRO}); go(location.hash.slice(1)||'inicio',true); initCaps();
</script>
