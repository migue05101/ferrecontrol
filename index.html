<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FerreControl</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F2FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FerreControl">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2347;--mut:#6B7094;--pur:#6C5CE7;--pur2:#9A90F8;--line:#E6E4F5;--ok:#1FA463;--warn:#E8890C;--bad:#DC4B4B;--yel:#F7B500;--card:rgba(255,255,255,.78);--sh:0 6px 20px rgba(112,100,200,.13)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;
 background:radial-gradient(70% 45% at 105% 22%,#E3DDFB 0,transparent 70%),radial-gradient(60% 30% at -5% 46%,#FCEEE4 0,transparent 70%),#F3F2FB;background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em}
.page{display:none;height:100dvh;overflow-y:auto}
.page.on{display:block}
.col{max-width:460px;margin:0 auto;padding:10px 16px 18px}
/* ---------- inicio ---------- */
.top{display:flex;align-items:center;gap:6px;height:52px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;position:relative;flex:none}
.ib svg{width:25px;height:25px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.av{background:#D9DBEC;border-radius:50%;width:36px;height:36px;margin-left:4px}
.ib.av svg{fill:var(--ink);stroke:none;width:22px;height:22px}
.ib .dot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:#FF8A1F;border:2px solid #F3F2FB}
.logo{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding-left:6px;line-height:1;min-width:0}
.logo svg{width:74px;height:15px;margin:0 0 -3px 2px;display:block}
.logo b{font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.logo b i{font-style:normal;background:linear-gradient(90deg,#4B3FE0,#7A5CF5);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-size:9.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:3px;margin-top:2px;white-space:nowrap}
.logo small::before{content:"";width:12px;height:2.5px;background:var(--yel);border-radius:2px}
.wv{display:inline-flex;align-items:center;gap:3px;height:26px}
.wv i{display:block;width:3.5px;border-radius:3px;background:var(--pur2);height:30%}
.wv i:nth-child(2),.wv i:nth-child(6){height:45%}.wv i:nth-child(3),.wv i:nth-child(5){height:75%}.wv i:nth-child(4){height:100%}
.wv.s5 i:nth-child(1),.wv.s5 i:nth-child(5){height:35%}.wv.s5 i:nth-child(2),.wv.s5 i:nth-child(4){height:65%}.wv.s5 i:nth-child(3){height:100%}
.hero{text-align:center;padding-top:2px}
.hero h1{font-size:21px;font-weight:600;line-height:1.22;letter-spacing:-.01em;margin:2px auto 10px;max-width:330px;min-height:52px;display:flex;align-items:center;justify-content:center}
.hero h1.heard{font-size:18px;font-weight:500;color:#4A4F7A}
.talk{display:block;margin:0 auto;position:relative;width:var(--R);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;--R:min(58vw,236px,31dvh)}
.talk::before{content:"";position:absolute;left:50%;top:calc(var(--R)/2);width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(140,130,245,.16) 0 48%,rgba(140,130,245,.07) 49% 62%,transparent 70%);pointer-events:none}
.ring{display:block;position:relative;width:var(--R);aspect-ratio:1;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#CBD2F0;
 box-shadow:0 0 14px 3px rgba(255,255,255,.95),0 0 44px 8px rgba(140,130,250,.35);transition:box-shadow .25s}
.ring img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.micrw{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:calc(var(--R)*-.2);position:relative;width:170%;margin-left:-35%}
.micb{width:calc(var(--R)*.4);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,#A39AF9,#6B5BE6);border:4px solid rgba(255,255,255,.9);box-shadow:0 10px 24px rgba(108,92,231,.45);transition:transform .12s}
.micb svg{width:44%;height:44%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.micrw .wv{height:34px;opacity:.75}
.micrw .wv i{width:4px}
.talk:active .micb{transform:scale(.94)}
.talk[data-s=listening] .ring{box-shadow:0 0 16px 4px #fff,0 0 0 8px rgba(108,92,231,.25),0 0 60px 18px rgba(108,92,231,.55)}
.talk[data-s=listening] .micb{background:linear-gradient(160deg,#FF8E8E,#E0457B);box-shadow:0 10px 26px rgba(224,69,123,.5)}
.talk[data-s=speaking] .ring{box-shadow:0 0 16px 4px #fff,0 0 54px 14px rgba(60,180,255,.55)}
.talk[data-s=thinking] .ring{animation:think 1s ease-in-out infinite alternate}
@keyframes think{to{box-shadow:0 0 14px 3px #fff,0 0 60px 16px rgba(247,181,0,.55)}}
.talk[data-s=listening] .wv i,.talk[data-s=speaking] .wv i,.hero[data-s=listening] .wv i,.hero[data-s=speaking] .wv i{animation:bar .7s ease-in-out infinite alternate}
.wv i:nth-child(2n){animation-delay:.15s!important}.wv i:nth-child(3n){animation-delay:.3s!important}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
@media (prefers-reduced-motion:reduce){.wv i,.talk .ring{animation:none!important}}
#status{font-size:14px;font-weight:500;margin:8px 0 12px;min-height:19px}
.card{background:var(--card);border:1px solid #fff;border-radius:20px;box-shadow:var(--sh)}
.reply{padding:13px 14px;text-align:left}
.rtx{display:flex;align-items:flex-start;gap:12px}
.rtx .wv{flex:none;margin-top:8px}
.rtx p{flex:1;font-size:15.5px;font-weight:500;line-height:1.3;min-width:0}
.dots{flex:none;width:36px;height:36px;border-radius:10px;color:var(--pur);font-weight:800;letter-spacing:1px;font-size:15px}
.rprod{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rprod b{font-size:30px;line-height:1}
.rprod small{color:var(--mut);font-size:13px;margin-right:auto}
.opts{display:grid;gap:6px;margin-top:10px}
.opts button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:500}
.cfm{display:flex;gap:8px;margin-top:11px}
.cfm .btn{flex:1}
.rlink{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.rlink button{color:var(--pur);font-weight:600;font-size:14px}
#typeForm{display:flex;gap:8px;margin-top:11px}
#typeForm input{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:10px 14px;font-size:16px;outline:none}
#typeForm input:focus{border-color:var(--pur)}
#typeForm button{width:42px;height:42px;border-radius:50%;background:var(--pur);display:grid;place-items:center;flex:none}
#typeForm svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#listLine{display:flex;width:100%;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-weight:600;font-size:14.5px}
#listLine span{background:var(--pur);color:#fff;border-radius:10px;padding:1px 8px;font-size:12.5px}
#listLine b{margin-left:auto}
#listLine em{font-style:normal;color:var(--pur)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.grid button{padding:11px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;letter-spacing:-.01em;font-weight:600;border-radius:18px;min-width:0}
.grid img{height:36px;width:auto;display:block}
.grid span{white-space:nowrap}
.today{display:flex;width:100%;align-items:center;gap:13px;padding:12px 16px;margin-top:12px;text-align:left}
.today .t{flex:1;min-width:0}
.today small{display:block;font-size:13px;font-weight:500}
.today b{font-size:22px}
.today em{font-style:normal;font-size:13.5px;font-weight:600;color:var(--ok);margin-left:8px}
.today em.dn{color:var(--bad)}
.mb{display:flex;align-items:flex-end;gap:4px;height:34px;flex:none}
.mb i{display:block;width:9px;border-radius:3px;background:#B3ABF6;min-height:4px}
.mb i:nth-last-child(2){background:var(--pur)}
.mb.sm{height:24px}.mb.sm i{width:7px;background:var(--pur)}
/* ---------- vistas ---------- */
.vtop{display:flex;align-items:center;gap:8px;height:52px;margin-bottom:6px}
.vtop h2{font-size:22px;font-weight:700;flex:1;letter-spacing:-.01em}
.back{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sub{color:var(--mut);font-size:13.5px;margin:-4px 0 12px}
.btn{background:linear-gradient(160deg,#8E84F5,#6B5BE6);color:#fff;border-radius:14px;padding:10px 15px;font-weight:600;font-size:14.5px;box-shadow:0 4px 12px rgba(108,92,231,.3)}
.btn.sec{background:#fff;color:var(--pur);border:1.5px solid #CFC9F7;box-shadow:none;padding:8.5px 14px}
.btn.dk{background:var(--ink);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.4}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.kpi{padding:11px 13px;border-radius:16px}
.kpi span{font-size:12px;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
.kpi.warn b{color:var(--warn)}.kpi.good b{color:var(--ok)}.kpi.bad b{color:var(--bad)}
.search{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;outline:none;margin-bottom:9px}
.search:focus{border-color:var(--pur)}
.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 13px;font-size:13px;font-weight:600}
.cats button.on{background:var(--pur);color:#fff;border-color:var(--pur)}
.list{overflow:hidden}
.rowi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:center}
.rowi:last-child{border-bottom:0}
.rowi .nm{font-weight:600}
.rowi .sb{color:var(--mut);font-size:12.5px;grid-column:1}
.rowi .r{grid-column:2;grid-row:1/span 2;text-align:right}
.rowi .r b{font-size:15.5px;display:block;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;background:#E3F5EB;color:#167A49;white-space:nowrap}
.pill.low{background:#FDEFD9;color:#A85F06}.pill.out,.pill.bad{background:#FCE3E3;color:#B93232}.pill.neu{background:#ECEBF7;color:var(--mut)}
.bar{height:6px;background:#ECEBF7;border-radius:4px;overflow:hidden;margin-top:6px;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.sect{font-size:16px;font-weight:700;margin:18px 2px 8px}
.chart{display:flex;align-items:flex-end;gap:7px;height:150px;padding:14px 14px 10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart i{display:block;width:100%;background:#B3ABF6;border-radius:6px 6px 2px 2px;min-height:3px}
.chart div:last-child i{background:var(--pur)}
.chart span{font-size:11px;color:var(--mut)}
.chart em{font-style:normal;font-size:10.5px;font-weight:600}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:last-child{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--ink);font-size:16px}
.reply .tbl{margin-top:8px;border-top:1px solid var(--line);font-size:14px}
.reply .tbl td{padding:7px 2px}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.li .nm{font-weight:600}.li .sb{color:var(--mut);font-size:12.5px}.li .tt{text-align:right;font-weight:700}
.qty{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.qty button{width:30px;height:30px;border-radius:9px;background:#ECEBF7;font-weight:700;font-size:16px}
.qty span{min-width:26px;text-align:center;font-weight:600}
.lfoot{padding:12px 14px 14px}
.lfoot .t{display:flex;justify-content:space-between;align-items:baseline}
.lfoot .t b{font-size:16px}.lfoot .t span{font-size:25px;font-weight:700}
.lfoot .iva{color:var(--mut);font-size:12px;text-align:right}
.lfoot .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.empty{color:var(--mut);text-align:center;padding:22px 14px;font-size:14px}
.note{font-size:12.5px;color:var(--mut);margin-top:12px}
.set{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set div{flex:1}.set small{display:block;color:var(--mut);font-size:12.5px}
.set select{border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;font-size:15px}
.sw{width:50px;height:30px;border-radius:16px;background:#CFCDE2;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--pur)}.sw[aria-checked=true]::after{left:23px}
/* ---------- hoja ---------- */
.ov{position:fixed;inset:0;background:rgba(30,35,71,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:#FBFAFF;width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px 22px}
.sheet h3{font-size:21px;font-weight:700;margin-bottom:10px;padding-right:38px}
.sheet .x{position:sticky;float:right;top:0;width:34px;height:34px;border-radius:50%;background:#ECEBF7;font-size:16px;z-index:2}
.sheet .card{background:#fff;border-color:var(--line);box-shadow:none}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fg label{font-size:12.5px;font-weight:600;color:var(--mut);display:block}
.fg label.w{grid-column:1/-1}
.fg input,.fg select{display:block;width:100%;margin-top:3px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-size:16px;font-weight:400;color:var(--ink)}
.sacts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.fact .hd{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.fact .hd b{font-size:18px}
.mnu button{display:flex;align-items:center;gap:14px;width:100%;padding:11px 6px;font-weight:600;font-size:16px;border-bottom:1px solid var(--line)}
.mnu img{height:30px;width:38px;object-fit:contain}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
:focus-visible{outline:2.5px solid var(--pur);outline-offset:2px}
@media (min-width:900px){
 #view .col{max-width:860px}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .ov{align-items:center}.sheet{border-radius:24px}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
}
</style>
</head>
<body>
<div class="page on" id="home"><div class="col">
  <header class="top">
    <button class="ib" data-act="menu" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 6.500h16M4 12h16M4 17.500h11"/></svg></button>
    <div class="logo"><svg viewBox="0 0 74 15" fill="none" stroke="#F7B500" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13.500L36 2l13 4.500V3.500h4.500v4.500L70 13.500"/></svg><b>Ferre<i>Control</i></b><small>Gestión Inteligente de Ferretería</small></div>
    <button class="ib" data-act="alerts" aria-label="Alertas"><svg viewBox="0 0 24 24"><path d="M6 16.500V11a6 6 0 0112 0v5.500l1.500 2h-15zM10 21h4"/></svg><span class="dot" id="bellDot" hidden></span></button>
    <button class="ib" data-act="store" aria-label="Datos de la ferretería"><svg viewBox="0 0 24 24"><path d="M4 9.500l1.500-5.500h13L20 9.500M4 9.500a2.700 2.700 0 005.300 0 2.700 2.700 0 005.400 0 2.700 2.700 0 005.300 0M5.500 12v8h13v-8M10 20v-5h4v5"/></svg></button>
    <button class="ib av" data-act="user" aria-label="Usuario"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.500" r="4"/><path d="M4 20.500c.6-4.300 3.800-6.500 8-6.500s7.400 2.200 8 6.500z"/></svg></button>
  </header>
  <div class="hero" id="hero">
    <span class="wv s5" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>

function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);if(S&&S.prods&&S.ventas&&S.users)return}}catch(e){} S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- lenguaje ---------- */
const NW={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};
const STOP=new Set('de del la el los las un una uno unos unas cuanto cuanta cuantos cuantas vale valen cuesta cuestan hay tiene tienen tenemos queda quedan precio valor a que en por favor me nos y o es son lo al para pulgada pulgadas dame deme diga digame dime ferro cerebro oye hola cual como esta estan se le con numero calibre cal tipo lista unidades unidad disponible disponibles mas x m kg w oz otro otra otros otras eso ese esa don dona senor senora sas maestro cliente ahi existencia existencias inventario'.split(' '));
function norm(s){
  s=String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let p;do{p=s;s=s.replace(/(\d)[.](\d{3})(?!\d)/g,'$1$2')}while(p!==s);
  s=s.replace(/1\/2/g,' media ').replace(/3\/4/g,' tres cuartos ').replace(/3\/8/g,' tres octavos ').replace(/1\/4/g,' un cuarto ');
  return s.replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();
}
const stem=t=>/^\d+$/.test(t)?t:(t.length>3&&t.endsWith('s')?t.slice(0,-1):t);
const kwTokens=str=>norm(str).split(' ').filter(t=>t&&!STOP.has(t)).map(t=>t in NW?String(NW[t]):stem(t));
const tmatch=(a,b)=>a===b||(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a)));
function rank(q,pool,textOf){
  const qt=[...new Set(kwTokens(q))]; if(!qt.length)return[];
  let best=0; const out=[];
  for(const o of pool){const kw=[...new Set(kwTokens(textOf(o)))]; let m=0,alpha=0;
    for(const t of qt) if(kw.some(k=>tmatch(k,t))){m++; if(!/^\d+$/.test(t))alpha++}
    if(alpha>0){out.push({o,m,pr:m/kw.length}); if(m>best)best=m}}
  return out.filter(x=>x.m===best).sort((a,b)=>b.pr-a.pr).map(x=>x.o);
}
const findProds=(q,pool)=>rank(q,pool||S.prods,p=>p.nombre+' '+p.alias+' '+p.unidad);
const findCli=q=>rank(q,S.clientes,c=>c.nombre);
const findProv=q=>rank(q,S.provs,c=>c.nombre);
function numAt(t,i){let total=0,cur=0,len=0,seen=false;
  for(let j=i;j<t.length;j++){const w=t[j];
    if(/^\d+$/.test(w)){cur+=+w;seen=true}
    else if(w in NW){cur+=NW[w];seen=true}
    else if(w==='mil'){cur=(cur||1)*1000;total+=cur;cur=0;seen=true}
    else if(w==='millon'||w==='millones'){total+=(cur||1)*1e6;cur=0;seen=true}
    else if(w==='y'&&seen&&t[j+1]&&(t[j+1] in NW)){}
    else break; len=j-i+1}
  return seen?{val:total+cur,len}:null}
function findMonto(t){let best=0;for(let i=0;i<t.length;i++){const r=numAt(t,i);if(r){if(r.val>best)best=r.val;i+=r.len-1}}return best}

/* ---------- operaciones ---------- */
const me=()=>S.users.find(u=>u.id===S.user)||S.users[0], isJefe=()=>me().rol==='jefe', usr=id=>S.users.find(u=>u.id===id);
const prod=id=>S.prods.find(p=>p.id===id), cli=id=>S.clientes.find(c=>c.id===id), prv=id=>S.provs.find(p=>p.id===id);
const listaTotal=()=>S.lista.reduce((a,i)=>a+i.c*prod(i.pid).precio,0);
const listaN=()=>S.lista.reduce((a,i)=>a+i.c,0);
function addLista(pid,c){const e=S.lista.find(i=>i.pid===pid); if(e)e.c+=c; else S.lista.push({pid,c}); save()}
function snapshot(){return S.lista.map(i=>{const p=prod(i.pid);return{pid:p.id,n:p.nombre,u:p.unidad,c:i.c,p:p.precio,k:p.costo}})}
function doVenta(credito,cid){
  const items=snapshot(), total=items.reduce((a,i)=>a+i.c*i.p,0), num='FV-'+(S.seq.fv++);
  items.forEach(i=>{const p=prod(i.pid);p.stock=Math.max(0,p.stock-i.c)});
  S.ventas.push({num,fecha:new Date().toISOString(),cid:cid||null,vend:S.user,items,total,credito:!!credito});
  if(credito){const c=cli(cid);c.saldo+=total;c.mov.push({f:new Date().toISOString(),t:'fiado',v:total,ref:num})}
  S.lista=[]; save(); return {num,total};
}
function doCot(cliente){const items=snapshot(), total=items.reduce((a,i)=>a+i.c*i.p,0), num='CT-'+(S.seq.ct++);
  S.cots.push({num,fecha:new Date().toISOString(),cliente:cliente||'Cliente de mostrador',items,total,estado:'Pendiente'}); S.lista=[]; save(); return {num,total}}
function doAbono(cid,v,ref){const c=cli(cid); v=Math.min(v,c.saldo); c.saldo-=v; c.mov.push({f:new Date().toISOString(),t:'abono',v,ref:ref||'Efectivo'}); save(); return v}
function doPagoProv(id,v){const x=S.cxp.find(c=>c.id===id); v=Math.min(v,x.valor-x.pagado); x.pagado+=v; save(); return v}
const lowStock=()=>S.prods.filter(p=>p.stock<=p.min).sort((a,b)=>a.stock/a.min-b.stock/b.min);
const porCobrar=()=>S.clientes.reduce((a,c)=>a+c.saldo,0);
const porPagar=()=>S.cxp.reduce((a,c)=>a+c.valor-c.pagado,0);
const vencidas=()=>S.cxp.filter(c=>c.valor>c.pagado&&new Date(c.vence)<new Date());
function ventasDe(dias,vend){const lim=new Date();lim.setHours(0,0,0,0);lim.setDate(lim.getDate()-(dias-1));
  const vs=S.ventas.filter(v=>new Date(v.fecha)>=lim&&(!vend||v.vend===vend));
  const total=vs.reduce((a,v)=>a+v.total,0), costo=vs.reduce((a,v)=>a+v.items.reduce((x,i)=>x+i.c*i.k,0),0);
  return{n:vs.length,total,costo,util:total-costo,vs}}

/* ---------- cerebro ---------- */
const R=(text,extra)=>Object.assign({text},extra||{});
const HELP='Puedes decirme, por ejemplo: «cuánto vale un bulto de cemento», «tubo de media», «agregar tres a la lista», «fiar a don Pedro», «cuánto debe don Pedro» o «qué se está acabando».';
function prodReply(p){ctx.lastPid=p.id;
  const st=p.stock<=0?'No hay existencias.':`Hay ${p.stock.toLocaleString('es-CO')} ${plural(p.unidad,p.stock)}.`+(p.stock<=p.min?' Ya está por debajo del mínimo.':'');
  return R(`${p.nombre}: ${fmt(p.precio)} por ${p.unidad}. ${st}`,{card:{pid:p.id}})}
function addReply(p,c){ctx.lastPid=p.id; addLista(p.id,c);
  const enLista=S.lista.find(i=>i.pid===p.id).c;
  const warn=enLista>p.stock?` Ojo: solo hay ${p.stock} en inventario.`:'';
  return R(`Listo, agregué ${c} ${plural(p.unidad,c)} de ${p.nombre}.${warn} La lista va en ${fmt(listaTotal())}.`,{changed:true})}
function brain(raw){
  raw=String(raw).trim(); let m;
  if(m=raw.match(/^#p(\d+)$/)){const p=prod(+m[1]);return p?prodReply(p):R('No encontré ese producto.')}
  if(m=raw.match(/^#a(\d+)x(\d+)$/)){const p=prod(+m[1]);return p?addReply(p,+m[2]):R('No encontré ese producto.')}
  if(m=raw.match(/^#f(\d+)$/)){const c=cli(+m[1]);return c?askFiar(c):R('No encontré ese cliente.')}
  const n=norm(raw), t=n.split(' ').filter(Boolean);
  if(!t.length)return R('No te escuché bien. Inténtalo otra vez.');
  if(ctx.pending){
    if(/^(si|confirmar?|confirmo|confirmado|dale|listo|hagale|correcto|ok|claro|de una)\b/.test(n))return doPending();
    const was=ctx.pending; ctx.pending=null;
    if(/^(no|cancelar?|cancela|cancele)\b/.test(n))return R('Cancelado. No guardé nada.');
    void was;
  }
  if(/\b(vaciar|vacia|vacie|limpiar|limpia|limpie|borrar|borra|borre)\b.*\b(lista|todo|carrito)\b/.test(n)){S.lista=[];save();return R('Lista vacía.',{changed:true})}
  if(/^(quitar|quita|quite|eliminar|elimina|elimine|sacar|saca|saque)\b/.test(n)){
    if(!S.lista.length)return R('La lista ya está vacía.');
    const f=findProds(n.replace(/^\S+/,''),S.lista.map(i=>prod(i.pid)));
    const p=f.length===1?f[0]:(!f.length&&ctx.lastPid&&S.lista.some(i=>i.pid===ctx.lastPid)?prod(ctx.lastPid):null);
    if(!p)return R('¿Cuál quito? Dime el producto como aparece en la lista.');
    S.lista=S.lista.filter(i=>i.pid!==p.id);save();
    return R(`Quité ${p.nombre}. La lista queda en ${fmt(listaTotal())}.`,{changed:true})}
  if(/\b(quien|quienes)\b.*\bdeben?\b|\bcartera\b|\bfiados\b|\bme deben\b|\bnos deben\b/.test(n)){
    const ds=S.clientes.filter(c=>c.saldo>0).sort((a,b)=>b.saldo-a.saldo);
    if(!ds.length)return R('Nadie debe nada en este momento.');
    return R(`Te deben ${fmt(porCobrar())} entre ${ds.length} clientes. El mayor saldo es de ${ds[0].nombre}, con ${fmt(ds[0].saldo)}.`,{rows:ds.map(c=>[c.nombre,fmt(c.saldo)]),nav:'cartera'})}
  if(/\b(abono|abona|abonar|abone|abonando|pago)\b/.test(n)&&!/\bproveedor/.test(n)){
    const cs=findCli(n), v=findMonto(t);
    if(cs.length!==1)return R('¿De quién es el abono? Dime, por ejemplo: «abono de 200 mil de don Pedro».');
    if(v<100)return R(`¿De cuánto es el abono de ${cs[0].nombre}?`);
    if(cs[0].saldo<=0)return R(`${cs[0].nombre} no tiene saldo pendiente.`);
    const val=Math.min(v,cs[0].saldo);
    ctx.pending={k:'abono',cid:cs[0].id,v:val};
    return R(`Voy a registrar un abono de ${fmt(val)} de ${cs[0].nombre}. Le quedaría un saldo de ${fmt(cs[0].saldo-val)}. ¿Confirmas?`,{confirm:true})}
  if(/\b(debemos|debo|por pagar|debe la ferreteria)\b/.test(n)){
    if(!isJefe())return R('Las deudas con proveedores solo las ve el administrador.');
    const ps=findProv(n);
    if(ps.length===1){const d=S.cxp.filter(c=>c.prov===ps[0].id).reduce((a,c)=>a+c.valor-c.pagado,0);
      return R(d>0?`A ${ps[0].nombre} le debemos ${fmt(d)}.`:`Con ${ps[0].nombre} estamos al día.`,{nav:'porpagar'})}
    const ve=vencidas(), tv=ve.reduce((a,c)=>a+c.valor-c.pagado,0);
    return R(`La ferretería debe ${fmt(porPagar())} a proveedores.`+(ve.length?` De eso, ${fmt(tv)} ya está vencido.`:' No hay nada vencido.'),
      {rows:S.cxp.filter(c=>c.valor>c.pagado).map(c=>[prv(c.prov).nombre,fmt(c.valor-c.pagado)]),nav:'porpagar'})}
  if(/\bdebe\b|\bsaldo\b|\bdebiendo\b/.test(n)){
    const cs=findCli(n);
    if(cs.length===1){const c=cs[0];return R(c.saldo>0?`${c.nombre} debe ${fmt(c.saldo)}. Su cupo es de ${fmt(c.cupo)}, le quedan ${fmt(Math.max(0,c.cupo-c.saldo))} disponibles.`:`${c.nombre} está al día, no debe nada.`,{nav:'cartera'})}
    if(cs.length>1)return R('Encontré varios clientes. ¿Cuál?',{chips:cs.map(c=>({l:c.nombre,c:'cuánto debe '+c.nombre}))});
    return R('No encontré ese cliente en la cartera.')}
  if(/\b(vendimos|vendido|vendio|ventas?)\b/.test(n)){
    const sem=/\bsemana\b/.test(n), cu=sem?'En los últimos 7 días':'Hoy';
    if(!isJefe()){const v=ventasDe(sem?7:1,S.user);return R(`${cu} llevas ${v.n} ventas por ${fmt(v.total)}.`,{nav:'reportes'})}
    const us=rank(n.replace(/\b(vendimos|vendido|vendio|ventas?|semana|hoy)\b/g,''),S.users,u=>u.nombre);
    if(us.length===1){const v=ventasDe(sem?7:1,us[0].id);return R(`${cu} ${us[0].nombre} lleva ${v.n} ventas por ${fmt(v.total)}.`,{nav:'reportes'})}
    const v=ventasDe(sem?7:1);
    return R(`${cu} van ${v.n} ventas por ${fmt(v.total)}. La utilidad bruta es de ${fmt(v.util)}.`,{rows:S.users.map(u=>{const x=ventasDe(sem?7:1,u.id);return[u.nombre,fmt(x.total)]}).filter(x=>x[1]!=='$0'),nav:'reportes'})}
  if(/\b(acab|agot|escas)|stock bajo|por pedir|que pedir|hace falta|hay que pedir/.test(n)){
    const l=lowStock(); if(!l.length)return R('Todo el inventario está por encima del mínimo.');
    return R(`Hay ${l.length} productos por debajo del mínimo. Los más urgentes: ${l.slice(0,3).map(p=>p.nombre).join(', ')}.`,{rows:l.map(p=>[p.nombre,`${p.stock} / mín. ${p.min}`]),nav:'inventario'})}
  if(/\b(proveedor|proveedores|surte)\b|\bquien (nos |me )?(vende|trae)\b/.test(n)){
    const f=findProds(n.replace(/\b(proveedor|proveedores|surte|quien|vende|trae)\b/g,''));
    if(f.length>=1){const p=f[0],pv=prv(p.prov);return R(`${p.nombre} nos lo surte ${pv.nombre}. Contacto: ${pv.contacto}, teléfono ${pv.tel}.`,{nav:'proveedores'})}
    return R(`Trabajamos con ${S.provs.length} proveedores. Dime el producto y te digo quién lo surte.`,{nav:'proveedores'})}
  if(/\b(ganancia|ganancias|utilidad|utilidades|como vamos|resumen|como va el negocio|balance)\b/.test(n)){
    if(!isJefe())return R('Ese resumen es solo para el administrador. Puedo decirte cuánto llevas vendido hoy.');
    const h=ventasDe(1), w=ventasDe(7);
    return R(`Hoy van ${fmt(h.total)} en ventas y ${fmt(h.util)} de utilidad bruta. En 7 días: ${fmt(w.total)} vendidos. Te deben ${fmt(porCobrar())} y la ferretería debe ${fmt(porPagar())}.`,{nav:'finanzas'})}
  if(/\b(total|cuanto va|cuanto llevo|cuanto llevamos|cuanto suma)\b/.test(n)){
    if(!S.lista.length)return R('La lista está vacía.');
    return R(`La lista tiene ${S.lista.length} productos y va en ${fmt(listaTotal())}, con IVA incluido.`)}
  if(/\b(fiar|fia|fie|fiele|fiado|fiarle|fiaselo|credito)\b/.test(n)){
    if(!S.lista.length)return R('Primero agrega productos a la lista y luego me dices a quién se le fía.');
    const cs=findCli(n.replace(/\b(fiar|fia|fie|fiele|fiado|fiarle|fiaselo|credito)\b/g,''));
    if(cs.length===1)return askFiar(cs[0]);
    return R('¿A quién se le fía?',{chips:S.clientes.map(c=>({l:c.nombre,c:'#f'+c.id}))})}
  if(/\bcotiza/.test(n)){
    if(!S.lista.length)return R('La lista está vacía. Agrega productos y luego la guardo como cotización.');
    const cs=findCli(n.replace(/\bcotiza\w*/g,'')); const r=doCot(cs.length===1?cs[0].nombre:null);
    return R(`Cotización ${r.num} guardada por ${fmt(r.total)}${cs.length===1?' para '+cs[0].nombre:''}.`,{changed:true,nav:'cotizaciones'})}
  if(/\b(facturar|factura|facture|facturele|cobrar|cobra|cobre|cobrele|vender|venda|cerrar)\b/.test(n)){
    if(!S.lista.length)return R('La lista está vacía. Dime qué productos agrego.');
    ctx.pending={k:'venta',credito:false,cid:null};
    return R(`Voy a facturar de contado ${listaN()} unidades por ${fmt(listaTotal())}. ¿Confirmas?`,{confirm:true})}
  const addRe=/^(agregar|agrega|agregue|agregame|agreguele|agregale|anadir|anade|anada|sumar|suma|sume|meter|mete|meta|poner|pon|ponga|pongale|incluir|incluye|incluya|echar|eche|echele|tambien|y)\b/;
  if(addRe.test(n)||/\ba la lista\b/.test(n)){
    let r=n.replace(/\ba la lista\b/g,' ').replace(/\s+/g,' ').trim();
    while(addRe.test(r))r=r.replace(addRe,'').trim();
    r=r.replace(/^(me|le|otros?|otras?)\b/,'').trim();
    let rt=r.split(' ').filter(Boolean), c=1;
    if(rt[0]==='media'&&rt[1]==='docena'){c=6;rt=rt.slice(2)}
    else{const q=numAt(rt,0); if(q&&q.val>0&&q.val<100000){c=q.val;rt=rt.slice(q.len); if(rt[0]==='docena'||rt[0]==='docenas'){c*=12;rt=rt.slice(1)}}}
    const rest=rt.join(' ');
    if(!kwTokens(rest).length){
      if(ctx.lastPid)return addReply(prod(ctx.lastPid),c);
      return R('¿Qué producto agrego? Dime, por ejemplo: «agregar dos tubos de media».')}
    const f=findProds(rest);
    if(f.length===1)return addReply(f[0],c);
    if(f.length>1)return R(`Tengo ${f.length} opciones. ¿Cuál agrego?`,{chips:f.slice(0,6).map(p=>({l:p.nombre,c:`#a${p.id}x${c}`}))});
    return R('No encontré ese producto en el inventario.',{unknown:true})}
  const f=findProds(n);
  if(f.length===1)return prodReply(f[0]);
  if(f.length>1)return R(`Tengo ${f.length} opciones. ¿Cuál necesitas?`,{chips:f.slice(0,6).map(p=>({l:`${p.nombre} · ${fmt(p.precio)}`,c:'#p'+p.id}))});
  return R('No encontré eso en el inventario. '+HELP,{unknown:true});
}
function askFiar(c){
  if(!S.lista.length)return R('La lista está vacía.');
  const tot=listaTotal(), nuevo=c.saldo+tot, pasa=nuevo>c.cupo;
  ctx.pending={k:'venta',credito:true,cid:c.id};
  return R(`Voy a fiarle ${fmt(tot)} a ${c.nombre}. Su saldo quedaría en ${fmt(nuevo)}.`+(pasa?` Ojo: supera su cupo de ${fmt(c.cupo)}.`:'')+' ¿Confirmas?',{confirm:true})}
function doPending(){const p=ctx.pending; ctx.pending=null;
  if(p.k==='venta'){if(!S.lista.length)return R('La lista está vacía.');const r=doVenta(p.credito,p.cid);
    return R(p.credito?`Hecho. Factura ${r.num} a crédito por ${fmt(r.total)} para ${cli(p.cid).nombre}. Ya descargué el inventario.`:`Hecho. Factura ${r.num} de contado por ${fmt(r.total)}. Ya descargué el inventario.`,{changed:true,factura:r.num})}
  if(p.k==='abono'){const v=doAbono(p.cid,p.v);return R(`Abono de ${fmt(v)} registrado. ${cli(p.cid).nombre} queda debiendo ${fmt(cli(p.cid).saldo)}.`,{changed:true})}
  return R('Listo.')}
if(typeof module!=='undefined')module.exports={seed,ventasDe,brain,norm,kwTokens,findProds,numAt,findMonto,get S(){return S},set S(v){S=v},ctx};
</script>

const MODS=[['ventas','Ventas'],['inventario','Inventario'],['compras','Compras'],['proveedores','Proveedores'],['clientes','Clientes'],['reportes','Reportes'],['finanzas','Finanzas'],['configuracion','Configuración']];

/* ---------- navegación ---------- */
function go(v,fromHash){v=NAVMAP[v]||v; view=MODS.some(m=>m[0]===v)?v:'inicio';
  $('#home').classList.toggle('on',view==='inicio'); $('#view').classList.toggle('on',view!=='inicio');
  if(view==='inicio')refreshHome(); else{renderView();$('#view').scrollTop=0}
  if(!fromHash){try{history.replaceState(null,'','#'+view)}catch(e){}}}
window.addEventListener('hashchange',()=>go(location.hash.slice(1),true));

/* ---------- inicio ---------- */
function alerts(){const a=[]; const low=lowStock(), ve=vencidas(), cu=S.clientes.filter(c=>c.cupo&&c.saldo/c.cupo>=.9);
  if(low.length)a.push({t:`${low.length} productos por debajo del mínimo`,s:low.slice(0,3).map(p=>p.nombre).join(', '),go:'inventario'});
  if(ve.length&&isJefe())a.push({t:`${ve.length} facturas de proveedores vencidas`,s:fmt(ve.reduce((x,c)=>x+c.valor-c.pagado,0))+' por pagar ya',go:'compras'});
  if(cu.length)a.push({t:`${cu.length} clientes cerca del cupo de crédito`,s:cu.map(c=>c.nombre).join(', '),go:'clientes'});
  return a}
function dayTotals(n,vend){const out=[];for(let d=n-1;d>=0;d--){const x=new Date();x.setDate(x.getDate()-d);const k=dayKey(x);out.push({l:d===0?'Hoy':x.toLocaleDateString('es-CO',{weekday:'short'}).replace('.',''),v:S.ventas.filter(v=>dayKey(v.fecha)===k&&(!vend||v.vend===vend)).reduce((a,v)=>a+v.total,0)})}return out}
function refreshHome(){
  $('#bellDot').hidden=!alerts().length;
  const ll=$('#listLine'); ll.hidden=!S.lista.length;
  ll.innerHTML=`Lista <span>${S.lista.length}</span><b class="num">${fmt(listaTotal())}</b><em>Ver ›</em>`}
function renderReply(r){
  let h=`<div class="rtx"><span class="wv s5" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><p>${esc(r.text)}</p><button class="dots" data-act="type" aria-label="Escribir la pregunta">•••</button></div>`;
  if(r.card){const p=prod(r.card.pid); if(p){const cls=p.stock<=0?'out':p.stock<=p.min?'low':'';
    h+=`<div class="rprod"><b class="num">${fmt(p.precio)}</b><small>por ${esc(p.unidad)}</small><span class="pill ${cls}">${p.stock<=0?'Agotado':'Hay '+p.stock.toLocaleString('es-CO')}</span><button class="btn sm" data-cmd="#a${p.id}x1" data-label="Agregar a la lista">+ Lista</button></div>`}}
  if(r.rows)h+=`<table class="tbl">${r.rows.slice(0,6).map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</table>`;
  if(r.chips)h+=`<div class="opts">${r.chips.map(c=>`<button data-cmd="${esc(c.c)}" data-label="${esc(c.l)}">${esc(c.l)}</button>`).join('')}</div>`;
  if(r.confirm)h+=`<div class="cfm"><button class="btn" data-cmd="confirmar" data-label="Confirmar">Confirmar</button><button class="btn sec" data-cmd="cancelar" data-label="Cancelar">Cancelar</button></div>`;
  const lk=[]; if(r.factura)lk.push(`<button data-act="fact:${r.factura}">Ver factura ${r.factura} ›</button>`);
  if(r.nav){const k=NAVMAP[r.nav]||r.nav;lk.push(`<button data-act="go:${k}">Abrir ${MODS.find(m=>m[0]===k)[1]} ›</button>`)}
  if(lk.length)h+=`<div class="rlink">${lk.join('')}</div>`;
  $('#replyBody').innerHTML=h}
function heard(t,live){const h=$('#headline');h.textContent=live?t:'«'+t+'»';h.classList.add('heard')}
function openType(){const f=$('#typeForm');f.hidden=false;$('#inp').focus()}

let sample=null,dict=null,tts=null,capsReady=false;
let listening=false,starting=false,speaking=false,busy=false,conv=false,pressed=false,wasActive=false,pendingStop=false,downAt=0,dBuf='',dTimer=null,spk=0,tip='';
function upd(){const s=listening?'listening':busy?'thinking':speaking?'speaking':'idle';
  $('#talk').dataset.s=s; $('#hero').dataset.s=s;
  $('#status').textContent=tip||({listening:conv&&!pressed?'Escuchando… toca para terminar':'Escuchando… suelta para responder',thinking:'Pensando…',speaking:conv?'Respondiendo… toca para detener':'Respondiendo…',
    idle:capsReady&&!dict?'Toca el robot para escribir tu pregunta':'Mantén presionado para hablar'})[s]}
function setTip(t){tip=t;upd();clearTimeout(setTip.t);if(t)setTip.t=setTimeout(()=>{tip='';upd()},4500)}
async function initCaps(){

function makeSR(SR){const cb={};let rec=null,active=false,stopRes=null,pend='';

        if(it){pend=it.trim();cb.partial&&cb.partial({text:pend})}};
      rec.onerror=e=>{if(!active)rej({code:(e.error==='not-allowed'||e.error==='service-not-allowed')?'not_granted':e.error})};
      rec.onend=()=>{const w=active;active=false;if(w){if(pend){const t=pend;pend='';cb.final&&cb.final({text:t})}cb.state&&cb.state({state:'idle'})}if(stopRes){stopRes();stopRes=null}};

    stop(){return new Promise(res=>{if(!rec||!active)return res();stopRes=res;try{rec.stop()}catch(e){res()}})},
    onPartial(f){cb.partial=f},onFinal(f){cb.final=f},onState(f){cb.state=f}}}

async function askClaude(text){

precio <nombre exacto de producto del catálogo>
agregar <cantidad> <nombre exacto de producto del catálogo>
quitar <nombre exacto de producto>
fiar a <nombre exacto de cliente>
abono de <valor en números> de <nombre exacto de cliente>
cuanto debe <nombre exacto de cliente>
facturar | cotizar | total | cartera | por pagar | ventas de hoy | ventas de la semana | stock bajo | resumen | vaciar lista
RESPUESTA: <respuesta breve en español, máximo dos frases, solo si es una pregunta que se responde con los datos de abajo o si el producto no existe>

Catálogo (nombre | precio | existencias | unidad):
${S.prods.map(p=>`${p.nombre} | ${p.precio} | ${p.stock} | ${p.unidad}`).join('\n')}

Proveedores: ${S.provs.map(c=>c.nombre).join('; ')}

El vendedor dijo: "${text}"`;
  const r=await sample(prompt,{modelTier:'quick',cache:false}); return (r&&r.text||'').trim().split('\n')[0]}
async function submit(text,label){
  text=String(text).trim(); if(!text||busy)return; stopSpeak();
  if(view!=='inicio')go('inicio');
  heard(label||text); busy=true; upd();
  let r=brain(text);
  if(r.unknown&&sample&&!text.startsWith('#')){
    try{const line=await askClaude(text);
      if(/^RESPUESTA:/i.test(line))r={text:line.replace(/^RESPUESTA:\s*/i,'')};
      else if(line){const r2=brain(line); if(!r2.unknown)r=r2}
    }catch(e){}}

  <div class="set"><div>Responder con voz<small>El asistente lee la respuesta en voz alta.</small></div><button class="sw" role="switch" aria-checked="${cfg.voz}" data-act="voz" aria-label="Responder con voz"></button></div>
  ${tts?`<div class="set"><div>Voz del asistente</div><select id="voiceSel" aria-label="Voz del asistente">${vs.map(v=>`<option value="${v[0]}" ${cfg.voice===v[0]?'selected':''}>${v[1]}</option>`).join('')}</select></div>`:''}
  <div class="set"><div>Micrófono<small>${!capsReady?'Comprobando…':dict?'Disponible en este dispositivo.':'No disponible en este dispositivo: se escribe la pregunta.'}</small></div><span class="pill ${dict?'':'neu'}">${dict?'Activo':'Sin voz'}</span></div>
  <div class="set"><div>Usuario<small>${esc(me().nombre)} · ${me().rol==='jefe'?'Jefe':'Vendedor'}</small></div><button class="btn sec sm" data-act="user">Cambiar</button></div>
  <div class="set"><div>Datos de muestra<small>Borra los cambios y vuelve al inventario inventado.</small></div><button class="btn sec sm" data-act="reset">Reiniciar</button></div></div>
  <p class="note">Prototipo: los productos, clientes, proveedores y cifras son inventados, y los cambios se guardan solo en este navegador.</p>`}

/* ---------- hojas ---------- */
function openSheet(h){$('#sheet').innerHTML='<button class="x" data-act="close" aria-label="Cerrar">✕</button>'+h;$('#ov').classList.add('on');$('#sheet').scrollTop=0}
function closeSheet(){$('#ov').classList.remove('on')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function docHTML(tipo,d,cliente,extra){const base=d.total/(1+IVA);
  return`<div class="fact"><div class="hd"><div><b>${tipo} ${d.num}</b><br>Ferretería de muestra</div><div style="text-align:right">${fdate(d.fecha)}<br>${ftime(d.fecha)}</div></div>
  <div>Cliente: <b>${esc(cliente)}</b>${extra||''}</div>
  <table class="tbl" style="margin-top:6px">${d.items.map(i=>`<tr><td style="padding-left:0">${i.c} × ${esc(i.n)}<br><span style="color:var(--mut);font-size:12.5px">${fmt(i.p)} / ${esc(i.u)}</span></td><td style="padding-right:0">${fmt(i.c*i.p)}</td></tr>`).join('')}
  <tr><td style="padding-left:0">Subtotal sin IVA</td><td style="padding-right:0">${fmt(base)}</td></tr><tr><td style="padding-left:0">IVA 19 %</td><td style="padding-right:0">${fmt(d.total-base)}</td></tr><tr class="tot"><td style="padding-left:0">Total</td><td style="padding-right:0">${fmt(d.total)}</td></tr></table></div>`}
const docText=(tipo,d,cliente)=>`${tipo} ${d.num} · Ferretería de muestra\nCliente: ${cliente}\n`+d.items.map(i=>`${i.c} x ${i.n}: ${fmt(i.c*i.p)}`).join('\n')+`\nTOTAL: ${fmt(d.total)} (IVA incluido)`;
function sheetFact(num){const v=S.ventas.find(x=>x.num===num);if(!v)return;const c=v.cid?cli(v.cid).nombre:'Mostrador';
  openSheet(docHTML('Factura',v,c,` · ${v.credito?'Crédito':'Contado'}`)+`<div class="sacts"><button class="btn sec" data-act="copy:f:${num}">Copiar texto</button></div><p class="note">Documento de prueba. La factura electrónica ante la DIAN se conecta en la versión final.</p>`)}
function sheetCot(num){const c=S.cots.find(x=>x.num===num);if(!c)return;
  openSheet(docHTML('Cotización',c,c.cliente,` · ${c.estado}`)+`<div class="sacts"><button class="btn" data-act="cot2lista:${num}">Pasar a la lista para vender</button><button class="btn sec" data-act="copy:c:${num}">Copiar para WhatsApp</button></div>`)}
function sheetProd(id){
  if(!isJefe()){const p=prod(+id);if(!p)return;openSheet(`<h3>${esc(p.nombre)}</h3><div class="kpis">${kpi('Precio',fmt(p.precio),'por '+esc(p.unidad))}${kpi('Existencias',p.stock.toLocaleString('es-CO'),'mínimo '+p.min,p.stock<=p.min?'warn':'good')}</div><div class="sacts"><button class="btn" data-act="add:${p.id}">+ A la lista</button></div>`);return}
  sheetProdEdit(id)}
function sheetProdEdit(id){const n=id==='new', p=n?{nombre:'',alias:'',unidad:'unidad',cat:'Obra gris',precio:'',costo:'',stock:'',min:'',prov:1}:prod(+id);
  openSheet(`<h3>${n?'Nuevo producto':'Producto'}</h3><form data-form="prod" data-id="${n?'new':p.id}"><div class="fg">
  <label class="w">Nombre<input name="nombre" required value="${esc(p.nombre)}"></label>
  <label class="w">Otros nombres con que lo piden<input name="alias" value="${esc(p.alias)}"></label>
  <label>Unidad<input name="unidad" required value="${esc(p.unidad)}"></label><label>Categoría<input name="cat" required value="${esc(p.cat)}"></label>
  <label>Precio de venta<input name="precio" type="number" inputmode="numeric" min="0" required value="${p.precio}"></label><label>Costo<input name="costo" type="number" inputmode="numeric" min="0" required value="${p.costo}"></label>
  <label>Existencias<input name="stock" type="number" inputmode="numeric" min="0" required value="${p.stock}"></label><label>Mínimo<input name="min" type="number" inputmode="numeric" min="0" required value="${p.min}"></label>
  <label class="w">Proveedor<select name="prov">${S.provs.map(v=>`<option value="${v.id}" ${v.id===p.prov?'selected':''}>${esc(v.nombre)}</option>`).join('')}</select></label></div>
  <div class="sacts"><button class="btn" type="submit">Guardar</button>${n?'':`<button class="btn dk" type="button" data-act="add:${p.id}">+ A la lista</button>`}</div></form>`)}
function sheetCli(id){if(id==='new'){openSheet(`<h3>Nuevo cliente</h3><form data-form="cli"><div class="fg"><label class="w">Nombre<input name="nombre" required></label><label>Teléfono<input name="tel"></label><label>Cupo de crédito<input name="cupo" type="number" inputmode="numeric" min="0" required value="500000"></label><label class="w">Nota<input name="nota"></label></div><div class="sacts"><button class="btn" type="submit">Guardar</button></div></form>`);return}
  const c=cli(+id);
  openSheet(`<h3>${esc(c.nombre)}</h3><div class="kpis">${kpi('Debe',fmt(c.saldo),'',c.saldo?'warn':'good')}${kpi('Cupo disponible',fmt(Math.max(0,c.cupo-c.saldo)),'de '+fmt(c.cupo))}</div><div>${esc(c.nota||'')} · ${esc(c.tel||'')}</div>
  ${c.saldo>0?`<form data-form="abono" data-id="${c.id}"><div class="fg" style="margin-top:10px"><label>Valor del abono<input name="v" type="number" inputmode="numeric" min="1" max="${c.saldo}" required></label><label>Medio<select name="ref"><option>Efectivo</option><option>Transferencia</option><option>Nequi</option></select></label></div><div class="sacts"><button class="btn" type="submit">Registrar abono</button></div></form>`:''}
  <div class="sect">Movimientos</div><div class="card"><table class="tbl">${c.mov.length?c.mov.slice().reverse().map(m=>`<tr><td>${m.t==='abono'?'Abono':'Fiado'} · ${esc(m.ref)}<br><span style="color:var(--mut);font-size:12.5px">${fdate(m.f)}</span></td><td style="color:${m.t==='abono'?'var(--ok)':'inherit'}">${m.t==='abono'?'−':'+'} ${fmt(m.v)}</td></tr>`).join(''):'<tr><td>Sin movimientos</td><td></td></tr>'}</table></div>`)}
function sheetCxp(id){const c=S.cxp.find(x=>x.id===+id), s=c.valor-c.pagado;
  openSheet(`<h3>${esc(prv(c.prov).nombre)}</h3><table class="tbl"><tr><td>Factura</td><td>${esc(c.ref)}</td></tr><tr><td>Valor</td><td>${fmt(c.valor)}</td></tr><tr><td>Abonado</td><td>${fmt(c.pagado)}</td></tr><tr><td>Vence</td><td>${fdate(c.vence)}</td></tr><tr class="tot"><td>Saldo</td><td>${fmt(s)}</td></tr></table>
  ${s>0?`<form data-form="pago" data-id="${c.id}"><div class="fg" style="margin-top:10px"><label class="w">Valor a pagar<input name="v" type="number" inputmode="numeric" min="1" max="${s}" value="${s}" required></label></div><div class="sacts"><button class="btn" type="submit">Registrar pago</button></div></form><p class="note">Solo registra el pago aquí; no mueve dinero.</p>`:''}`)}
function sheetProv(id){const p=prv(+id), ps=S.prods.filter(x=>x.prov===p.id), low=ps.filter(x=>x.stock<=x.min);
  const ped=low.map(x=>({x,c:Math.max(x.min*2-x.stock,1)})), tp=ped.reduce((a,i)=>a+i.c*i.x.costo,0);
  openSheet(`<h3>${esc(p.nombre)}</h3><div>${esc(p.contacto)} · ${esc(p.tel)}</div>
  <div class="sect">Pedido sugerido</div>${ped.length?`<div class="card"><table class="tbl">${ped.map(i=>`<tr><td>${i.c} ${esc(plural(i.x.unidad,i.c))} · ${esc(i.x.nombre)}<br><span style="color:var(--mut);font-size:12.5px">hay ${i.x.stock}, mínimo ${i.x.min}</span></td><td>${isJefe()?fmt(i.c*i.x.costo):''}</td></tr>`).join('')}${isJefe()?`<tr class="tot"><td>Total estimado</td><td>${fmt(tp)}</td></tr>`:''}</table></div><div class="sacts"><button class="btn sec" data-act="copy:p:${p.id}">Copiar pedido para WhatsApp</button></div>`:'<div class="empty" style="padding:12px">Nada por pedir: todo está sobre el mínimo.</div>'}
  <div class="sect">Productos que surte</div><div class="card"><table class="tbl">${ps.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${x.stock}</td></tr>`).join('')}</table></div>`)}
function sheetUser(){openSheet(`<h3>¿Quién está usando la app?</h3><div class="card list">${S.users.map(u=>`<button class="rowi" data-act="setuser:${u.id}"><span class="nm">${esc(u.nombre)}</span><span class="sb">${u.rol==='jefe'?'Jefe · ve todo: ventas totales, por empleado, finanzas y deudas':'Vendedor · ve sus propias ventas'}</span><span class="r"><span class="pill ${u.id===S.user?'':'neu'}">${u.id===S.user?'Activo':'Entrar'}</span></span></button>`).join('')}</div><p class="note">En la versión final cada persona entra con su clave.</p>`)}
function sheetMenu(){openSheet(`<h3>Menú</h3><div class="mnu">${MODS.map(([k,l])=>`<button data-act="go:${k}"><img src="${IMG[k]}" alt="">${l}</button>`).join('')}</div>`)}
function sheetAlerts(){const a=alerts();openSheet(`<h3>Alertas</h3>${a.length?`<div class="card list">${a.map(x=>`<button class="rowi" data-act="go:${x.go}"><span class="nm">${esc(x.t)}</span><span class="sb">${esc(x.s)}</span><span class="r"><span class="pill low">Ver</span></span></button>`).join('')}</div>`:'<div class="empty">Sin alertas por ahora.</div>'}`)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}

/* ---------- eventos ---------- */
function refresh(){refreshHome();if(view!=='inicio')renderView()}
let resetArm=0;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cmd],[data-act],[data-q],[data-cat]'); if(!b){if(e.target.id==='ov')closeSheet();return}
  if(b.dataset.cat){invCat=b.dataset.cat;renderView();return}
  if(b.dataset.q){const i=S.lista.find(x=>x.pid===+b.dataset.pid);if(i){i.c+=+b.dataset.q;if(i.c<=0)S.lista=S.lista.filter(x=>x!==i);save();renderView()}return}
  if(b.dataset.cmd){submit(b.dataset.cmd,b.dataset.label||b.textContent.trim());return}
  const [a,x,y]=b.dataset.act.split(':');
  if(a==='close')closeSheet();
  else if(a==='go'){closeSheet();go(x)}
  else if(a==='menu')sheetMenu();
  else if(a==='alerts')sheetAlerts();
  else if(a==='store')openSheet('<h3>Ferretería de muestra</h3><p>Este prototipo usa datos inventados: 32 productos, 5 clientes con crédito y 6 proveedores.</p><p class="note">En la versión del cliente aquí van el nombre, el NIT, la dirección y la resolución de facturación.</p>');
  else if(a==='user')sheetUser();
  else if(a==='setuser'){S.user=+x;save();ctx.pending=null;closeSheet();renderReply({text:INTRO});refresh();toast('Sesión: '+me().nombre)}
  else if(a==='type')openType();
  else if(a==='voz'){cfg.voz=!cfg.voz;saveCfg();if(!cfg.voz)stopSpeak();renderView()}
  else if(a==='reset'){if(Date.now()-resetArm>3000){resetArm=Date.now();toast('Toca otra vez para borrar los cambios');return}
    resetArm=0;S=seed();save();ctx.lastPid=null;ctx.pending=null;renderReply({text:INTRO});refresh();toast('Datos de muestra restaurados')}
  else if(a==='fact')sheetFact(x);
  else if(a==='cot')sheetCot(x);
  else if(a==='prod')sheetProd(x);
  else if(a==='cli')sheetCli(x);
  else if(a==='cxp')sheetCxp(x);
  else if(a==='prov')sheetProv(x);
  else if(a==='add'){addLista(+x,1);closeSheet();refresh();toast('Agregado a la lista')}
  else if(a==='cot2lista'){const c=S.cots.find(k=>k.num===x);S.lista=c.items.filter(i=>prod(i.pid)).map(i=>({pid:i.pid,c:i.c}));c.estado='Vendida';save();closeSheet();go('ventas');toast('Cotización cargada en la lista')}
  else if(a==='copy'){if(x==='f'){const v=S.ventas.find(k=>k.num===y);copy(docText('Factura',v,v.cid?cli(v.cid).nombre:'Mostrador'))}
    else if(x==='c'){const c=S.cots.find(k=>k.num===y);copy(docText('Cotización',c,c.cliente))}
    else{const p=prv(+y);copy(`Pedido para ${p.nombre}\n`+S.prods.filter(k=>k.prov===p.id&&k.stock<=k.min).map(k=>`${Math.max(k.min*2-k.stock,1)} ${plural(k.unidad,2)} · ${k.nombre}`).join('\n'))}}
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(f)), k=f.dataset.form;
  if(k==='prod'){const o={nombre:d.nombre.trim(),alias:d.alias.trim(),unidad:d.unidad.trim().toLowerCase(),cat:d.cat.trim(),precio:+d.precio,costo:+d.costo,stock:+d.stock,min:+d.min,prov:+d.prov};
    if(f.dataset.id==='new')S.prods.push(Object.assign({id:S.seq.id++},o));else Object.assign(prod(+f.dataset.id),o);toast('Producto guardado')}
  else if(k==='cli'){S.clientes.push({id:S.seq.id++,nombre:d.nombre.trim(),nota:d.nota.trim(),tel:d.tel.trim(),cupo:+d.cupo,saldo:0,mov:[]});toast('Cliente guardado')}
  else if(k==='abono'){const v=doAbono(+f.dataset.id,+d.v,d.ref);toast('Abono de '+fmt(v)+' registrado')}
  else if(k==='pago'){const v=doPagoProv(+f.dataset.id,+d.v);toast('Pago de '+fmt(v)+' registrado')}
  save();closeSheet();refresh()});
document.addEventListener('input',e=>{if(e.target.id==='invQ'){invQ=e.target.value;$('#invList').innerHTML=invRows()}});
document.addEventListener('change',e=>{if(e.target.id==='voiceSel'){cfg.voice=e.target.value;saveCfg();speak('Hola, esta es mi voz.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
renderReply({text:INTRO}); go(location.hash.slice(1)||'inicio',true); initCaps();
</script>
</body>
</html>
